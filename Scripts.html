function _valorAtualCampo_(v, campo) {
  if (!v) return '';
  if (campo.indexOf('foto') === 0) return (v.fotos && v.fotos[campo.substring(4)]) || '';
  const x = v[campo];
  return x === null || x === undefined ? '' : String(x);
}

function abrirFormViatura(placa) {
  const edicao = ESTADO.dados.edicao || [];
  if (!ESTADO.admin || !edicao.length) { toast('Edição disponível apenas para o administrador.'); return; }
  const porCampo = {}; edicao.forEach(e => { if (e.campo) porCampo[e.campo] = e; });
  const v = placa ? ESTADO.veiculos.find(x => x.placa === placa) : null;
  if (placa && !v) return;
  const novo = !placa;

  // sugestões por campo (valores já usados na frota)
  const sugestoes = {};
  CAMPOS_SUGESTAO.forEach(c => {
    const m = new Map();
    ESTADO.veiculos.forEach(x => { const val = _valorAtualCampo_(x, c); if (val) m.set(val, (m.get(val) || 0) + 1); });
    sugestoes[c] = Array.from(m.keys()).sort((a, b) => m.get(b) - m.get(a)).slice(0, 40);
  });

  const usados = new Set();
  const campoHtml = campo => {
    const info = porCampo[campo];
    if (!info || !info.editavel) return '';
    usados.add(campo);
    const atual = novo ? '' : _valorAtualCampo_(v, campo);
    const chave = escAttr(campo);
    if (campo === 'placa' && !novo)
      return `<div class="form-campo"><label>${esc(info.nome)}</label><input value="${escAttr(atual)}" disabled title="A placa identifica a linha e não é alterada por aqui"></div>`;
    const obrig = novo && camposObrigatorios().indexOf(campo) >= 0;
    const numero = ['anoFab', 'anoMod', 'anoEx', 'odometro', 'qtdAbast'].indexOf(campo) >= 0;
    const lista = sugestoes[campo] ? `list="sug-${chave}"` : '';
    const longo = CAMPOS_LONGOS.indexOf(campo) >= 0;
    return `<div class="form-campo ${longo ? 'largo' : ''}" data-campo="${chave}" data-original="${escAttr(atual)}">
      <label>${esc(info.nome)}${(campo === 'placa' && novo) || obrig ? ' <span class="obrig">*</span>' : ''}</label>
      ${longo && campo.indexOf('obs') === 0 ? `<textarea rows="2" data-e>${esc(atual)}</textarea>` : `<input ${numero ? 'type="number" inputmode="numeric"' : 'type="text"'} value="${escAttr(atual)}" ${lista} data-e ${campo === 'placa' ? 'style="text-transform:uppercase"' : ''} ${obrig || (campo === 'placa' && novo) ? 'data-obrig' : ''}>`}
      ${sugestoes[campo] ? `<datalist id="sug-${chave}">${sugestoes[campo].map(o => `<option value="${escAttr(o)}">`).join('')}</datalist>` : ''}
    </div>`;
  };

  let corpo = '';
  GRUPOS_EDICAO.forEach(([titulo, campos]) => {
    const html = campos.map(campoHtml).filter(Boolean).join('');
    if (html) corpo += secao(titulo, `<div class="form-grade">${html}</div>`);
  });
  const soltos = edicao.filter(e => e.campo && e.editavel && !usados.has(e.campo) && e.campo !== 'placa' && e.campo.indexOf('foto') !== 0).map(e => campoHtml(e.campo)).filter(Boolean).join('');
  if (soltos) corpo += secao('Outros campos editáveis', `<div class="form-grade">${soltos}</div>`);
  if (!novo) corpo += secaoFotosEdicao(v, porCampo) + secaoDocumentosEdicao(v, porCampo);
  const bloqueadas = edicao.filter(e => !e.editavel).length;

  htm('gaveta-cab', `
    <div class="titulo"><h2>${novo ? 'Cadastrar nova viatura' : 'Editar ' + esc(v.placa) + ' — ' + esc(v.modeloCurto)}</h2>
      <div class="sub">${novo ? 'A linha nova replica as fórmulas da ConsultaBD automaticamente' : esc(v.unidade || '')}</div></div>
    <button class="gaveta-fechar" onclick="${novo ? 'fecharFicha()' : `abrirFicha('${escAttr(v.placa)}')`}" title="Voltar sem salvar">×</button>`);
  htm('gaveta-corpo', corpo + `
    <div class="form-acoes">
      <button class="btn amarelo" id="btn-salvar-viatura">${novo ? 'Cadastrar viatura' : 'Salvar alterações'}</button>
      <button class="btn claro" onclick="${novo ? 'fecharFicha()' : `abrirFicha('${escAttr(placa || '')}')`}">Cancelar</button>
      <span class="form-aviso">${bloqueadas} colunas com fórmula ou preenchidas por script ficam de fora — são atualizadas pela própria planilha.</span>
    </div>`);
  cls('gaveta-fundo', 'aberta', true); cls('gaveta', 'aberta', true);
  document.body.style.overflow = 'hidden';
  const corpoEl = el('gaveta-corpo'); if (corpoEl) corpoEl.scrollTop = 0;
  document.querySelectorAll('#gaveta-corpo button[data-girar]').forEach(b => b.addEventListener('click', () => girarFoto(placa, b.dataset.girar, b)));
  document.querySelectorAll('#gaveta-corpo .foto-slot input[type=file]').forEach(inp => inp.addEventListener('change', () => {
    if (inp.files && inp.files[0]) enviarFoto(placa, inp.dataset.ang, inp.files[0]);
    inp.value = '';
  }));
  document.querySelectorAll('#gaveta-corpo input[data-doc]').forEach(inp => inp.addEventListener('change', () => {
    if (inp.files && inp.files[0]) enviarDocumento(placa, inp.dataset.doc, inp.files[0]);
    inp.value = '';
  }));
  document.querySelectorAll('#gaveta-corpo [data-e]').forEach(i => i.addEventListener('input', () => {
    const fc = i.closest('.form-campo'); fc.classList.toggle('mudou', i.value !== fc.dataset.original);
  }));
  ouvir('btn-salvar-viatura', 'click', () => enviarFormViatura(novo ? null : placa));
}

function enviarFormViatura(placa) {
  const novo = !placa;
  const alteracoes = {};
  document.querySelectorAll('#gaveta-corpo .form-campo[data-campo]').forEach(fc => {
    const i = fc.querySelector('[data-e]'); if (!i) return;
    let valor = i.value;
    if (fc.dataset.campo === 'placa') valor = valor.trim().toUpperCase();
    if (novo ? valor !== '' : valor !== fc.dataset.original) alteracoes[fc.dataset.campo] = valor;
  });
  if (novo) {
    const faltando = [];
    document.querySelectorAll('#gaveta-corpo .form-campo[data-campo]').forEach(fc => {
      const i = fc.querySelector('[data-e]'); if (!i || !i.hasAttribute('data-obrig')) return;
      if (!String(i.value).trim()) { faltando.push(fc.querySelector('label').textContent.replace(' *', '').trim()); fc.classList.add('faltando'); }
      else fc.classList.remove('faltando');
    });
    if (faltando.length) { toast('Preencha os obrigatórios: ' + faltando.slice(0, 5).join(', ') + (faltando.length > 5 ? '…' : '')); return; }
  }
  if (novo && !alteracoes.placa) { toast('Informe a placa.'); return; }
  if (!novo && !Object.keys(alteracoes).length) { toast('Nada foi alterado.'); return; }
  const btn = el('btn-salvar-viatura'); if (btn) { btn.disabled = true; btn.textContent = 'Gravando na ConsultaBD…'; }
  const depois = r => {
    if (sessaoExpirou(r)) return;
    if (!r || !r.ok) { if (btn) { btn.disabled = false; btn.textContent = novo ? 'Cadastrar viatura' : 'Salvar alterações'; } toast((r && r.erro) || 'Falha ao gravar.'); return; }
    let msg = (novo ? 'Viatura cadastrada' : r.gravados.length + ' campo(s) gravado(s)');
    if (r.recusados && r.recusados.length) msg += ' • recusados: ' + r.recusados.join('; ');
    toast(msg);
    const alvo = novo ? alteracoes.placa : placa;
    fecharFicha();
    recarregarAposEdicao(alvo);
  };
  const falha = e => { if (btn) { btn.disabled = false; btn.textContent = novo ? 'Cadastrar viatura' : 'Salvar alterações'; } toast('Erro: ' + (e && e.message ? e.message : e)); };
  if (novo) google.script.run.withSuccessHandler(depois).withFailureHandler(falha).criarViatura(ESTADO.token, alteracoes);
  else google.script.run.withSuccessHandler(depois).withFailureHandler(falha).salvarViatura(ESTADO.token, placa, alteracoes);
}

function recarregarAposEdicao(placa) {
  toast('Recarregando dados da planilha…');
  google.script.run
    .withSuccessHandler(dados => {
      if (sessaoExpirou(dados)) return;
      if (!dados || dados.erro) { toast('Gravado, mas a releitura falhou — use o botão ⟳.'); return; }
      iniciar(dados);
      if (placa && ESTADO.veiculos.some(x => x.placa === placa)) abrirFicha(placa);
    })
    .withFailureHandler(() => toast('Gravado, mas a releitura falhou — use o botão ⟳.'))
    .carregarDados(ESTADO.token, true);
}

function _redimensionarImagem_(arquivo, maxLado, qualidade) {
  return new Promise((res, rej) => {
    const leitor = new FileReader();
    leitor.onerror = () => rej(new Error('Falha ao ler o arquivo'));
    leitor.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('Arquivo não é uma imagem válida'));
      img.onload = () => {
        const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const dataUrl = c.toDataURL('image/jpeg', qualidade);
        res(dataUrl.substring(dataUrl.indexOf(',') + 1));
      };
      img.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
  });
}

function enviarFoto(placa, ang, arquivo) {
  if (!ESTADO.dados.fotosHabilitadas) { toast('Envio de fotos desligado (CONFIG.PASTA_FOTOS vazio).'); return; }
  const status = el('foto-status-' + ang);
  const diga = t => { if (status) status.textContent = t; };
  diga('Comprimindo…');
  _redimensionarImagem_(arquivo, 1600, 0.85)
    .then(base64 => {
      diga('Enviando (' + Math.round(base64.length * 0.75 / 1024) + ' KB)…');
      google.script.run
        .withSuccessHandler(r => {
          if (sessaoExpirou(r)) return;
          if (!r || !r.ok) { diga(''); toast((r && r.erro) || 'Falha no envio.'); return; }
          diga('Salva ✓');
          const v = ESTADO.veiculos.find(x => x.placa === placa);
          if (v) { v.fotos = v.fotos || {}; v.fotos[ang] = r.link; v.temFotos = 'Sim'; }
          const slot = document.querySelector(`.foto-slot[data-ang="${ang}"] .foto`);
          if (slot) { slot.classList.remove('sem'); slot.innerHTML = `<img src="https://drive.google.com/thumbnail?id=${r.id}&sz=w400"><span class="rotulo">${ang}</span>`; }
          toast('Foto ' + ang + ' de ' + placa + ' atualizada na ConsultaBD');
        })
        .withFailureHandler(e => { diga(''); toast('Erro no envio: ' + (e && e.message ? e.message : e)); })
        .salvarFotoViatura(ESTADO.token, placa, ang, base64, 'image/jpeg');
    })
    .catch(e => { diga(''); toast(e.message); });
}

function consultadaHoje(v) {
  if (!v.multasConsultaEm) return false;
  const hoje = new Date(); const dd = ('0' + hoje.getDate()).slice(-2) + '/' + ('0' + (hoje.getMonth() + 1)).slice(-2) + '/' + hoje.getFullYear();

function elegiveis(acao, lista, op) {
  const motivo = {};
  const sel = lista.filter(v => {
    if (acao === 'crlv') {
      if (!v.crv || !v.codCrv) { motivo[v.placa] = 'sem CRV/código'; return false; }
      if (!v.renavam) { motivo[v.placa] = 'sem renavam'; return false; }
      if (op.escopo === 'sem' && v.linkCrlv) { motivo[v.placa] = 'já tem CRLV'; return false; }
      if (op.escopo === 'desatualizado' && v.linkCrlv && v.anoEx >= anoAtual()) { motivo[v.placa] = 'CRLV em dia'; return false; }
      return true;
    }
    if (acao === 'audit') {
      if (!v.linkCrlv) { motivo[v.placa] = 'sem CRLV para auditar'; return false; }
      return true;
    }
    if (acao === 'multas') {
      if (!v.renavam) { motivo[v.placa] = 'sem renavam'; return false; }
      if (op.pularHoje && consultadaHoje(v)) { motivo[v.placa] = 'já consultada hoje'; return false; }
      return true;
    }
    if (acao === 'boleto') {
      if (!v.renavam) { motivo[v.placa] = 'sem renavam'; return false; }
      if (op.somenteAtrasados && v.anoEx && v.anoEx >= anoAtual()) { motivo[v.placa] = 'licenciamento em dia'; return false; }
      return true;
    }
    return false;
  });
  return { sel: sel, motivo: motivo };
}
function opcoesAcao(acao) {
  if (acao === 'crlv') { const r = document.querySelector('input[name="crlv-escopo"]:checked'); return { escopo: r ? r.value : 'sem' }; }
  if (acao === 'multas') return { pularHoje: !el('multas-rehoje') || !el('multas-rehoje').checked };
  if (acao === 'boleto') return { somenteAtrasados: !el('boleto-todas') || !el('boleto-todas').checked };
  return {};
}

/* ---------------- motor de lote (navegador orquestra; 1 placa por chamada) ---------------- */
function prepararLote(acao) {
  const op = opcoesAcao(acao);
  const e = elegiveis(acao, ESTADO.filtrado, op);
  const pulados = Object.keys(e.motivo).map(p => ({ placa: p, st: 'PULADA', detalhe: e.motivo[p] }));
  if (!e.sel.length) { toast('Nenhuma viatura elegível na seleção (' + pulados.length + ' puladas).'); return; }
  const naFila = !!ACOES_DEF[acao].fila;
  if (!confirm(ACOES_DEF[acao].rotulo + '\n\n' + (naFila ? 'Enviar ' : 'Executar em ') + e.sel.length + ' viatura(s)' +
      (naFila ? ' para a fila do DETRAN?' : '?') + (pulados.length ? '\n(' + pulados.length + ' serão puladas: já feitas ou sem dados)' : ''))) return;

  // Ações que dependem do DETRAN não rodam aqui: o Google não alcança o portal.
  // Vão para a aba FilaAcoes e o worker_detran.py executa na rede local.
  if (naFila) {
    const botao = document.querySelector('button[data-acao="' + acao + '"]');
    if (botao) { botao.disabled = true; botao.textContent = 'Enfileirando…'; }
    google.script.run
      .withSuccessHandler(r => {
        if (sessaoExpirou(r)) return;
        if (!r || !r.ok) { toast((r && r.erro) || 'Falha ao enfileirar.'); renderAcoes(ESTADO.filtrado); return; }
        toast(r.enfileiradas + ' viatura(s) na fila do DETRAN' + (r.repetidas && r.repetidas.length ? ' • ' + r.repetidas.length + ' já estavam pendentes' : '') + '. Rode o trabalhador para processar.');
        ESTADO.subAcoes = 'fila';
        document.querySelectorAll('#subabas-acoes .subaba').forEach(x => x.classList.toggle('ativa', x.dataset.sub === 'fila'));
        renderAcoes(ESTADO.filtrado);
      })
      .withFailureHandler(err => { toast('Erro: ' + (err && err.message ? err.message : err)); renderAcoes(ESTADO.filtrado); })
      .enfileirarAcoes(ESTADO.token, acao, e.sel.map(v => v.placa));
    return;
  }

  ESTADO.lote = { acao: acao, fila: e.sel.map(v => v.placa), total: e.sel.length, feito: 0, ok: 0, erro: 0, ativo: true, itens: pulados.slice() };
  renderAcoes(ESTADO.filtrado);
  processarProximo();
}

function processarProximo() {
  const L = ESTADO.lote;
  if (!L || !L.ativo) return;
  if (!L.fila.length) { L.ativo = false; L.terminou = true; desenharLote(); toast('Lote concluído: ' + L.ok + ' ok, ' + L.erro + ' erro(s).'); return; }
  const placa = L.fila.shift();
  L.atual = placa; desenharLote();
  google.script.run
    .withSuccessHandler(r => {
      L.feito++;
      if (r && r.expirado) { L.ativo = false; sessaoExpirou(r); return; }
      if (r && r.ok) { L.ok++; L.itens.unshift({ placa: placa, st: r.status || 'OK', detalhe: (r.detalhe || '') + (r.link ? ' • ' : ''), link: r.link || '' }); }
      else { L.erro++; L.itens.unshift({ placa: placa, st: 'ERRO', detalhe: (r && r.erro) || 'sem resposta' }); }
      desenharLote();
      setTimeout(processarProximo, 1000);
    })
    .withFailureHandler(e => {
      L.feito++; L.erro++;
      L.itens.unshift({ placa: placa, st: 'ERRO', detalhe: String(e && e.message ? e.message : e) });
      desenharLote();
      setTimeout(processarProximo, 1500);
    })[ACOES_DEF[L.acao].fn](ESTADO.token, placa);
}

function pararLote() { if (ESTADO.lote) { ESTADO.lote.ativo = false; ESTADO.lote.terminou = true; desenharLote(); toast('Lote interrompido.'); } }
function limparLote() { ESTADO.lote = null; recarregarAposEdicao(null); mudarAba('acoes'); }

function desenharLote() {
  const area = el('lote-area'); const L = ESTADO.lote;
  if (!area || !L) return;

    <div class="lote-progresso"><div class="lote-barra"><div class="preench" style="width:${pct}%"></div></div></div>
    <div class="form-acoes">${L.terminou
      ? '<button class="btn amarelo" onclick="limparLote()">Fechar e recarregar dados</button>'
      : '<button class="btn claro" onclick="pararLote()">Parar após a atual</button><span class="form-aviso">Mantenha esta aba aberta até o fim.</span>'}</div>
    <div class="lote-itens">${L.itens.map(i => `<div class="lote-item ${/ERRO/.test(i.st) ? 'erro' : /PULADA/.test(i.st) ? 'pulado' : 'ok'}">

function faltasDaViatura(v) {
  return CHECAGENS_COMPLETUDE.filter(([campo]) => {
    if (campo.indexOf('foto') === 0) return !(v.fotos && v.fotos[campo.substring(4)]);
    const x = v[campo];
    return x === null || x === undefined || String(x).trim() === '';
  }).map(([, rotulo]) => rotulo);
}

function renderCompletude(c, lista) {
  const linhas = lista.map(v => ({ v: v, faltas: faltasDaViatura(v) }));

  linhas.sort((a, b) => b.faltas.length - a.faltas.length || a.v.placa.localeCompare(b.v.placa));

      ${kpi('Cadastro completo', completas, Math.round(completas / Math.max(1, lista.length) * 100) + '% da seleção', completas === lista.length ? 'verde' : 'ambar', null, true)}
      ${kpi('Campos verificados', total, 'obrigatórios + documentos + fotos', '', null, true)}
      ${kpi('Falta mais', piores.length ? piores[0][0] : '—', piores.length ? 'em ' + piores[0][1] + ' viaturas' : '', piores.length ? 'vermelho' : 'verde', null, true)}
    </div>
    <div class="cartao largo" style="margin-bottom:14px"><div class="cartao-cab"><h3>O que mais falta na seleção</h3><small>clique para ver só quem falta… na tabela abaixo</small></div>
      <div style="display:flex; flex-wrap:wrap; gap:6px">${piores.map(([f, n]) => `<button class="subaba ${ESTADO.filtroFalta === f ? 'ativa' : ''}" data-f="${escAttr(f)}">${esc(f)} (${n})</button>`).join('') || '<span class="ok-txt">Nada faltando</span>'}</div></div>
    <div class="cartao largo"><div class="cartao-cab"><h3>Completude por viatura</h3><small>clique na linha para completar no formulário de edição</small></div>
      <div class="mini-tabela" style="max-height:600px"><table class="tabela-simples"><thead><tr><th>Placa</th><th>Modelo</th><th>Unidade</th><th>Completo</th><th>O que falta</th></tr></thead><tbody>
      ${linhas.filter(l => !ESTADO.filtroFalta || l.faltas.indexOf(ESTADO.filtroFalta) >= 0).slice(0, 300).map(l => {
        const p = Math.round((total - l.faltas.length) / total * 100);
        return `<tr class="linha" data-placa="${escAttr(l.v.placa)}"><td><b style="font-family:var(--fonte-dados)">${esc(l.v.placa)}</b></td><td>${esc(l.v.modeloCurto)}</td><td>${esc(l.v.unidadeCurta)}</td>
          <td style="white-space:nowrap"><span class="completude-barra"><span class="preench" style="width:${p}%; background:${cor(p)}"></span></span> <b style="font-family:var(--fonte-dados)">${p}%</b></td>
          <td>${l.faltas.length ? l.faltas.map(f => `<span class="chip-falta">${esc(f)}</span>`).join('') : '<span class="ok-txt">completo</span>'}</td></tr>`;
      }).join('')}</tbody></table></div></div>`;
  c.querySelectorAll('button[data-f]').forEach(b => b.addEventListener('click', () => { ESTADO.filtroFalta = ESTADO.filtroFalta === b.dataset.f ? '' : b.dataset.f; renderAcoes(ESTADO.filtrado); }));
  c.querySelectorAll('tr.linha').forEach(t => t.addEventListener('click', () => abrirFormViatura(t.dataset.placa)));

/* ---------------- ações individuais na ficha ---------------- */
function acaoIndividual(acao, placa, botao) {
  if (ACOES_DEF[acao] && ACOES_DEF[acao].fila) {
    if (botao) { botao.disabled = true; botao.dataset.txt = botao.textContent; botao.textContent = 'Enfileirando…'; }
    google.script.run
      .withSuccessHandler(r => {
        if (botao) { botao.disabled = false; botao.textContent = botao.dataset.txt; }
        if (sessaoExpirou(r)) return;
        if (!r || !r.ok) { toast((r && r.erro) || 'Falha ao enfileirar.'); return; }
        toast(r.enfileiradas ? placa + ' na fila do DETRAN — rode o trabalhador para processar.' : placa + ' já estava na fila.');
      })
      .withFailureHandler(e => { if (botao) { botao.disabled = false; botao.textContent = botao.dataset.txt; } toast('Erro: ' + (e && e.message ? e.message : e)); })
      .enfileirarAcoes(ESTADO.token, acao, [placa]);
    return;
  }
  if (botao) { botao.disabled = true; botao.dataset.txt = botao.textContent; botao.textContent = 'Executando…'; }
  google.script.run
    .withSuccessHandler(r => {
      if (botao) { botao.disabled = false; botao.textContent = botao.dataset.txt; }
      if (sessaoExpirou(r)) return;
      if (!r || !r.ok) { toast((r && r.erro) || 'Falha na ação.'); return; }
      toast(placa + ': ' + r.status + (r.detalhe ? ' — ' + r.detalhe : ''));
      if (r.link) window.open(r.link, '_blank');
      recarregarAposEdicao(placa);
    })
    .withFailureHandler(e => { if (botao) { botao.disabled = false; botao.textContent = botao.dataset.txt; } toast('Erro: ' + (e && e.message ? e.message : e)); })[ACOES_DEF[acao].fn](ESTADO.token, placa);
}

function enviarCrlvManual(placa, arquivo, statusEl) {
  const diga = t => { if (statusEl) statusEl.textContent = t; };
  if (!/pdf$/i.test(arquivo.type) && !/\.pdf$/i.test(arquivo.name)) { toast('Envie um PDF.'); return; }
  if (arquivo.size > 8 * 1024 * 1024) { toast('PDF acima de 8 MB.'); return; }
  diga('Enviando…');
  const leitor = new FileReader();
  leitor.onload = () => {
    const base64 = String(leitor.result).substring(String(leitor.result).indexOf(',') + 1);
    google.script.run
      .withSuccessHandler(r => {
        if (sessaoExpirou(r)) return;
        if (!r || !r.ok) { diga(''); toast((r && r.erro) || 'Falha no envio.'); return; }
        diga('Anexado ✓'); toast(placa + ': ' + r.detalhe);
        recarregarAposEdicao(placa);
      })
      .withFailureHandler(e => { diga(''); toast('Erro: ' + (e && e.message ? e.message : e)); })
      .anexarCrlv(ESTADO.token, placa, base64);
  };
  leitor.readAsDataURL(arquivo);
}

/** Executa a chamada ao servidor e desenha o resultado no cartão. */
function chamarImportacao(id, aoTerminar, executar) {
  const status = el('imp-status-' + id), resultado = el('imp-result-' + id);
  if (status) status.textContent = 'Processando…';
  if (resultado) resultado.innerHTML = '';
  const run = google.script.run
    .withSuccessHandler(r => {
      if (aoTerminar) aoTerminar(r);
      if (sessaoExpirou(r)) return;
      if (!r || !r.ok) { if (status) status.textContent = ''; toast((r && r.erro) || 'Falha na importação.'); return; }
      if (status) status.textContent = '';
      desenharResultadoImportacao(id, r);
    })
    .withFailureHandler(e => {
      if (aoTerminar) aoTerminar(null);
      if (status) status.textContent = '';
      toast('Erro: ' + (e && e.message ? e.message : e));
    });
  executar(run);
}

function desenharResultadoImportacao(id, r) {
  const resultado = el('imp-result-' + id);
  const dado = (k, v, classe) => `<div class="dado"><div class="k">${k}</div><div class="v ${classe || ''}" style="font-size:14px">${v}</div></div>`;
  let html = '';
  if (r.campos) {
    const c = r.campos;
    html = `<div class="grade-dados" style="margin-top:10px">
      ${dado('Título', esc(c.titulo || '—'))}${dado('NF', esc(c.numeroNfse || '—'))}
      ${dado('Valor total', esc(c.valorTotal || '—'))}${c.reembolsoPecas ? dado('Peças', esc(c.reembolsoPecas)) : ''}
      ${c.reembolsoMaoObra ? dado('Mão de obra', esc(c.reembolsoMaoObra)) : ''}
      ${c.outrosValor ? dado('Outros itens', fmtMoeda(c.outrosValor), 'alerta-txt') : ''}
      ${dado('Emissão', esc(c.dataEmissao || '—'))}${dado('Vencimento', esc(c.vencimento || '—'))}
      ${dado('Competência', esc(c.competencia || '—'))}${r.linha ? dado(r.atualizou ? 'Linha atualizada' : 'Linha criada', r.linha, 'ok-txt') : ''}</div>` +
      (r.conferencia ? `<div class="cartao-dica" style="${r.conferencia.confere ? '' : 'border-left:3px solid var(--vermelho)'}">
         ${r.conferencia.confere ? '✓ Itens conferem com o total da nota' : '⚠ Os itens somam ' + fmtMoeda(r.conferencia.soma) + ' e o total é ' + fmtMoeda(r.conferencia.total)}
         ${r.conferencia.itens.length ? '<br>Além de peças e mão de obra: ' + esc(r.conferencia.itens.join(' · ')) + ' — gravado em Outros Descontos.' : ''}
       </div>` : '') +
      (r.linkNota ? `<a class="btn claro" href="${escAttr(r.linkNota)}" target="_blank" rel="noopener" style="margin-top:8px; text-decoration:none">${icoPdf()} Abrir a nota guardada</a>` : '');
    toast('Título ' + (c.titulo || '') + (r.atualizou ? ' atualizado na linha ' + r.linha + '.' : ' gravado em nova linha.'));
  } else {
    html = `<div class="grade-dados" style="margin-top:10px">
      ${r.lidos !== undefined ? dado('Lidos', fmtInt(r.lidos)) : ''}
      ${dado('Inseridos', fmtInt(r.inseridos || 0), 'ok-txt')}
      ${r.duplicados !== undefined ? dado('Já existiam', fmtInt(r.duplicados)) : ''}
      ${r.periodo ? dado('Período', esc(r.periodo)) : ''}
      ${r.competencia ? dado('Competência', esc(r.competencia)) : ''}
      ${r.total !== undefined ? dado('Total das OS', fmtMoeda(r.total)) : ''}
      ${r.pecas !== undefined ? dado('Peças · mão de obra', fmtMoeda(r.pecas) + ' · ' + fmtMoeda(r.mo)) : ''}</div>` +
      (r.aviso ? `<div class="cartao-dica">${esc(r.aviso)}</div>` : '');
    if (r.atualizadoEm) {
      html += `<div class="cartao-dica">Origem: ${esc(r.origem || '')}. ${r.apagados ? fmtInt(r.apagados) + ' linha(s) anterior(es) removida(s). ' : ''}Atualizado em ${esc(r.atualizadoEm)}.
        ${r.semCorrespondencia && r.semCorrespondencia.length ? '<br><b style="color:var(--vermelho)">Sem correspondência na origem (ficaram vazias):</b> ' + esc(r.semCorrespondencia.join(', ')) : 'Todas as colunas encontraram correspondência.'}</div>`;
      if (ESTADO.dados && ESTADO.dados.meta) ESTADO.dados.meta.pgfAtualizado = r.atualizadoEm;
    }
    toast(fmtInt(r.inseridos || 0) + ' linha(s) inserida(s)' + (r.destino ? ' em ' + r.destino : ''));
    ESTADO.uso = null;
  }
  if (resultado) resultado.innerHTML = html;
}

function enviarImportacao(id, arquivo) {
  const limite = id === 'titAbast' || id === 'titManut' ? 15 : 25;
  if (arquivo.size > limite * 1024 * 1024) { toast('Arquivo acima de ' + limite + ' MB.'); return; }
  const status = el('imp-status-' + id);
  if (status) status.textContent = 'Lendo ' + arquivo.name + ' (' + Math.round(arquivo.size / 1024) + ' KB)…';
  const leitor = new FileReader();
  leitor.onerror = () => { if (status) status.textContent = 'Falha ao ler o arquivo.'; };
  leitor.onload = () => {
    const base64 = String(leitor.result).substring(String(leitor.result).indexOf(',') + 1);
    const pacote = { nome: arquivo.name, mimeType: arquivo.type, base64: base64 };
    if (status) status.textContent = 'Enviando…' + (id === 'titAbast' || id === 'titManut' ? ' (leitura do PDF pode levar até um minuto)' : '');
    chamarImportacao(id, null, run => {
      if (id === 'abast' || id === 'manut') return run.importarBase(ESTADO.token, id, pacote);
      if (id === 'titAbast') return run.importarTituloAbast(ESTADO.token, pacote);
      if (id === 'titManut') return run.importarTituloManut(ESTADO.token, pacote);
      if (id === 'detalhe') return run.importarDetalhamento(ESTADO.token, pacote, val('det-titulo'), val('det-comp'));
      if (id === 'aceiteGestor') return run.importarAceites(ESTADO.token, pacote, 'Gestor');
      if (id === 'aceiteAuto') return run.importarAceites(ESTADO.token, pacote, 'Automático');
      if (id === 'glosa') return run.importarGlosaAnp(ESTADO.token, val('glosa-comp'), 'arquivo', pacote);
      toast('Tipo de importação desconhecido.');
    });
  };
  leitor.readAsDataURL(arquivo);
}

/* ---------------- Relatório de glosa ---------------- */
function competenciaBR(valor) {
  if (!valor) return '';
  if (/^\d{2}\/\d{4}$/.test(valor)) return valor;              // já está em MM/AAAA
  if (/^\d{4}-\d{2}/.test(valor)) return valor.substring(5, 7) + '/' + valor.substring(0, 4);
  return valor;
}

function carregarCombustiveisGlosa() {
  const caixa = el('glosa-combs'); if (!caixa) return;
  const comp = competenciaBR(val('glosa-rel-comp'));
  if (!comp) { caixa.innerHTML = '<span class="foto-data">Escolha a competência.</span>'; return; }
  caixa.innerHTML = '<span class="foto-data">Lendo os abastecimentos da competência…</span>';
  const run = servidor('combustiveisDaCompetencia',
    r => {
      if (!r || !r.ok) { caixa.innerHTML = '<span class="foto-data">' + esc((r && r.erro) || 'Falha ao ler.') + '</span>'; return; }
      if (!r.combustiveis.length) { caixa.innerHTML = '<span class="foto-data">Nenhum abastecimento em ' + esc(comp) + '.</span>'; return; }
      caixa.innerHTML = r.combustiveis.map(c => `<label title="${c.anp ? 'ANP: ' + escAttr(c.anp) : 'sem produto correspondente na ANP'}">
        <input type="checkbox" value="${escAttr(c.nome)}" ${c.anp ? 'checked' : 'disabled'}> ${esc(c.nome)}
        <small style="color:var(--tinta-suave)">${c.qtd} abast.${c.anp ? '' : ' • sem equivalente na ANP'}</small></label>`).join('');
    },
    e => { caixa.innerHTML = '<span class="foto-data">' + esc(String(e && e.message ? e.message : e)) + '</span>'; });
  if (run) run.combustiveisDaCompetencia(ESTADO.token, comp);
}

function gerarGlosa() {
  const comp = competenciaBR(val('glosa-rel-comp'));
  if (!comp) { toast('Informe a competência.'); return; }
  const escolhidos = Array.from(document.querySelectorAll('#glosa-combs input:checked')).map(i => i.value);
  if (!escolhidos.length) { toast('Escolha ao menos um combustível.'); return; }
  const btn = el('btn-rel-glosa'), status = el('glosa-status'), resultado = el('glosa-result');
  btn.disabled = true; btn.textContent = 'Apurando…';
  if (status) status.textContent = 'Cruzando AbastBD com o histórico da ANP…';
  if (resultado) resultado.innerHTML = '';
  const run = servidor('gerarRelatorioGlosa',
    r => {
      btn.disabled = false; btn.textContent = 'Gerar PDF';
      if (!r || !r.ok) { if (status) status.textContent = ''; falhaNoCartao('glosa-result', (r && r.erro) || 'Falha ao gerar.'); return; }
      if (status) status.innerHTML = entregarPdf(r);
      if (resultado) resultado.innerHTML = `<div class="grade-dados" style="margin-top:10px">
        <div class="dado"><div class="k">Total da glosa</div><div class="v ${r.total ? 'alerta-txt' : 'ok-txt'}">${fmtMoeda(r.total)}</div></div>
        <div class="dado"><div class="k">Acima do teto</div><div class="v">${fmtInt(r.comGlosa)} de ${fmtInt(r.avaliados)}</div></div>
        ${r.grupos.map(g => `<div class="dado"><div class="k">${esc(g.combustivel)}</div><div class="v">${fmtMoeda(g.subtotal)} <small style="font-weight:500; color:var(--tinta-suave)">${g.itens} item(ns)</small></div></div>`).join('')}
      </div>${r.semTeto && r.semTeto.length ? `<div class="cartao-dica">Sem teto publicado na ANP: ${esc(r.semTeto.join('; '))}</div>` : ''}`;
    },
    e => { btn.disabled = false; btn.textContent = 'Gerar PDF'; if (status) status.textContent = ''; falhaNoCartao('glosa-result', e); });
  if (run) run.gerarRelatorioGlosa(ESTADO.token, comp, escolhidos);
}

/* ---------------- Estado do servidor e das bases ---------------- */
function verificarServidor() {
  const caixa = el('estado-servidor'); if (!caixa) return;
  const run = servidor('infoServidor',
    r => {
      if (!r || !r.ok) { caixa.textContent = 'Não consegui verificar o servidor.'; return; }
      const abas = Object.keys(r.abas || {})
        .map(k => `${esc(k)}: ${r.abas[k] ? fmtInt(r.abas[k]) + ' linhas' : '<b style="color:var(--vermelho)">ausente</b>'}`).join(' · ');
      const partes = [];
      if (r.faltando && r.faltando.length) {
        partes.push(`<b style="color:var(--vermelho)">Faltam funções no servidor: ${esc(r.faltando.join(', '))}.</b> Cole o Codigo.gs e faça Nova versão.`);
      } else {
        partes.push(`Servidor v${esc(r.versao)}${r.versao !== VERSAO_PAINEL ? ' (interface v' + esc(VERSAO_PAINEL) + ')' : ''} — funções completas.`);
      }
      if (r.erros && r.erros.length) partes.push(`<b style="color:var(--vermelho)">Sem acesso a ${esc(r.erros.join(' | '))}</b>${r.conta ? ' — o app executa como <b>' + esc(r.conta) + '</b>; compartilhe a planilha com essa conta.' : ''}`);
      if (abas) partes.push('Bases: ' + abas);
      caixa.innerHTML = partes.join('<br>');
    },
    () => { caixa.innerHTML = '<b style="color:var(--vermelho)">O servidor não respondeu à verificação.</b> Cole o Codigo.gs mais recente e faça Nova versão.'; });
  if (run) run.infoServidor(ESTADO.token);
  else caixa.innerHTML = '<b style="color:var(--vermelho)">Servidor antigo:</b> a verificação nem existe nele. Cole o Codigo.gs e faça Nova versão.';
}


/* ---------------- Competências existentes nas bases ---------------- */
function carregarCompetencias() {
  const preencher = (id, lista, rotuloVazio) => {
    const caixa = el(id + '-disp'); if (!caixa) return;
    if (!lista.length) { caixa.innerHTML = '<span style="color:var(--vermelho)">' + rotuloVazio + '</span>'; return; }
    const recentes = lista.slice(0, 6).map(c => `<b>${esc(c.comp)}</b> (${fmtInt(c.qtd)})`).join(' · ');
    caixa.innerHTML = 'Competências com dados: ' + recentes + (lista.length > 6 ? ' …' : '');
    const campo = el(id);
    if (campo && lista[0]) campo.value = lista[0].comp.substring(3) + '-' + lista[0].comp.substring(0, 2);
  };
  const run = servidor('competenciasDisponiveis',
    r => {
      if (!r || !r.ok) return;
      preencher('pecas', r.competencias.detalhamento, 'nenhuma competência encontrada no DetalhamentoDB');
      preencher('aceites', r.competencias.aceites, 'nenhuma competência encontrada no AceitesDB');
      if (r.competencias.erro) toast('Leitura das bases: ' + r.competencias.erro, true);
    },
    e => {
      ['pecas-disp', 'aceites-disp'].forEach(id => { const c = el(id); if (c) c.innerHTML = '<span style="color:var(--vermelho)">não consegui listar as competências</span>'; });
    });
  if (run) run.competenciasDisponiveis(ESTADO.token);
}


/* ============================================================
   ACOMPANHAMENTO DE ORDENS DE SERVIÇO
   Tela de trabalho: o que está com o gestor (nível 2) em primeiro
   plano, com edição de observações, relato e justificativa.
   ============================================================ */
const NIVEIS_OS = [
  { k: 'n2',   rotulo: 'Aguardando gestor — nível 2', re: /CLIENTE\s*N[ÍI]VEL\s*2|CLIENTE\s*NIVEL\s*2/i },
  { k: 'n1',   rotulo: 'Aguardando gestor — nível 1', re: /CLIENTE\s*N[ÍI]VEL\s*1|CLIENTE\s*NIVEL\s*1/i },
  { k: 'vist', rotulo: 'Aguardando vistoriador',      re: /VISTORIADOR/i },
  { k: 'rev',  rotulo: 'Pedidos de revisão',          re: /REVIS/i },
  { k: 'env',  rotulo: 'Não enviadas ao cliente',     re: /N[ÃA]O ENVIADAS/i },
  { k: 'apr',  rotulo: 'Aprovadas e não iniciadas',   re: /APROVADAS/i },
  { k: 'conc', rotulo: 'Concluídas e não cobradas',   re: /CONCLU/i },
  { k: 'cob',  rotulo: 'Cobradas',                    re: /^COBRADAS$/i }
];
function classeAprovacao(v) {
  const t = String(v || '').toLowerCase();
  if (/aprovar|aprovad/.test(t)) return 'ok';
  if (/diligen/.test(t)) return 'atencao';
  if (/revis/.test(t)) return 'revisar';
  return '';
}
/** Campo de texto cresce conforme o conteúdo, até um limite.
    Quando a tela ainda não está visível, scrollHeight vem zero — nesse caso
    estimamos pela quantidade de texto e remedimos depois. */
function ajustarAltura(t) {
  t.style.height = 'auto';
  const medido = t.scrollHeight;
  if (medido > 4) { t.style.height = Math.min(medido + 2, 200) + 'px'; return; }
  const largura = Math.max(t.clientWidth || 220, 160);
  const linhas = Math.max(1, Math.ceil((t.value || '').length / Math.max(18, Math.floor(largura / 6.5))));
  t.style.height = Math.min(26 + (linhas - 1) * 16, 200) + 'px';
}

/** Remede todos os campos da tela de OS depois que ela fica visível. */
function ajustarAlturasOS() {
  document.querySelectorAll('.tabela-os textarea.campo-os').forEach(ajustarAltura);
}

function nivelDaOS(status) {
  const t = String(status || '').trim();
  for (let i = 0; i < NIVEIS_OS.length; i++) if (NIVEIS_OS[i].re.test(t)) return NIVEIS_OS[i].k;
  return 'outros';
}
function pesoNivel(k) { const i = NIVEIS_OS.findIndex(n => n.k === k); return i < 0 ? 99 : i; }

/** Junta a OS com o cadastro da viatura: modelo e unidade vêm da ConsultaBD, não da aba OS. */
function osComViatura(o) {
  const v = ESTADO.veiculos.find(x => x.placa === o.placa || x.placaMerc === o.placa || x.placaRes === o.placa);
  return {
    o: o, v: v || null,
    modelo: v ? (v.modeloCurto || v.modelo) : (o.modelo || ''),
    modeloCompleto: v ? v.modelo : (o.modelo || ''),
    unidade: v ? (v.unidadeCurta || v.unidade) : (o.unidade || ''),
    nivel: nivelDaOS(o.status)
  };
}

function renderOSAcompanhar(lista) {
  const c = el('os-conteudo'); if (!c) return;
  const exib = new Set(lista.map(v => v.placa));
  const filtroAtivo = Object.values(ESTADO.filtros).some(s => s.size) || ESTADO.busca || ESTADO.odoMin !== null || ESTADO.odoMax !== null;
  const todas = (ESTADO.dados.os || []).filter(o => o.origem === 'PENDENTE')
    .map(osComViatura)
    .filter(x => !filtroAtivo || !x.v || exib.has(x.v.placa));

  const contagem = {};
  todas.forEach(x => { contagem[x.nivel] = (contagem[x.nivel] || 0) + 1; });
  const nivel = ESTADO.nivelOS;
  const selecionadas = (nivel === 'todas' ? todas : todas.filter(x => x.nivel === nivel))
    .sort((a, b) => pesoNivel(a.nivel) - pesoNivel(b.nivel) || (b.o.valor || 0) - (a.o.valor || 0));

  const soma = arr => arr.reduce((s, x) => s + (x.o.valor || 0), 0);
  const n2 = todas.filter(x => x.nivel === 'n2');
  const porUnidade = new Map(), porOficina = new Map();
  selecionadas.forEach(x => {
    porUnidade.set(x.unidade || '—', (porUnidade.get(x.unidade || '—') || 0) + (x.o.valor || 0));
    porOficina.set(x.o.oficina || '—', (porOficina.get(x.o.oficina || '—') || 0) + (x.o.valor || 0));
  });
  const barras = (mapa, cor) => {
    const itens = Array.from(mapa.entries()).sort((a, b) => b[1] - a[1]).slice(0, 8);
    const maximo = Math.max(1, ...itens.map(i => i[1]));
    return itens.map(([k, v]) => `<button class="barra" style="cursor:default"><span class="rotulo">${esc(k)}</span>
      <span class="trilha"><span class="preench" style="width:${Math.round(v / maximo * 100)}%; background:${cor}"></span></span>
      <span class="valor">${fmtMoeda(v)}</span></button>`).join('') || '<div class="vazio">Sem dados</div>';
  };

  const rotuloNivel = nivel === 'todas' ? 'todas as situações' : (NIVEIS_OS.find(n => n.k === nivel) || {}).rotulo || nivel;

  const versaoServidor = (ESTADO.dados.meta && ESTADO.dados.meta.versaoCodigo) || '';
  const camposVazios = selecionadas.length && !selecionadas.some(x => x.o.aprovacao || x.o.linkAnalise || x.o.relato);
  const aviso = (!versaoServidor || versaoServidor < '2.18.2')
    ? `<div class="cartao largo" style="margin-bottom:12px"><div class="alerta-item" style="cursor:default">
         <span class="t">SERVIDOR DESATUALIZADO</span><div style="margin-top:3px">O Codigo.gs em execução é a versão ${esc(versaoServidor || 'anterior a 2.18')}, que não lê as colunas Aprovação e Relatório da Análise. Cole o Codigo.gs no editor, faça Implantar → Nova versão e clique no ⟳ do topo.</div></div></div>`
    : (camposVazios ? `<div class="cartao largo" style="margin-bottom:12px"><div class="alerta-item amb" style="cursor:default">
         <span class="t">COLUNAS VAZIAS</span><div style="margin-top:3px">O servidor (v${esc(versaoServidor)}) leu a aba OS mas relato, aprovação e link vieram em branco. Clique no ⟳ do topo para reler a planilha — os dados podem estar em cache.</div></div></div>` : '');

  c.innerHTML = aviso + `
    <div class="kpis">
      ${kpi('Aguardando você (nível 2)', n2.length, fmtMoeda(soma(n2)) + ' orçado', n2.length ? 'vermelho' : 'verde', null, true)}
      ${kpi('Na seleção atual', selecionadas.length, esc(rotuloNivel), '', null, true)}
      ${kpi('Valor orçado', fmtMoeda(soma(selecionadas)), 'ticket médio ' + fmtMoeda(selecionadas.length ? soma(selecionadas) / selecionadas.length : 0), 'ambar', null, true)}
      ${kpi('Viaturas', new Set(selecionadas.map(x => x.o.placa)).size, 'distintas na seleção', '', null, true)}
      ${kpi('Unidades', porUnidade.size, 'com OS na seleção', 'ciano', null, true)}
    </div>

    <div class="os-nivel">
      ${NIVEIS_OS.filter(n => contagem[n.k]).map(n => `<button class="subaba ${nivel === n.k ? 'ativa' : ''}" data-nivel="${n.k}">${esc(n.rotulo)}<span class="n">${contagem[n.k]}</span></button>`).join('')}

      const mudou = t.value !== t.dataset.original;
      t.classList.toggle('sujo', mudou);
      if (t.tagName === 'TEXTAREA') ajustarAltura(t);
      if (t.classList.contains('aprovacao')) t.className = 'campo-os aprovacao ' + classeAprovacao(t.value) + (mudou ? ' sujo' : '');
      const chave = t.dataset.os + '|' + t.dataset.campo;
      if (mudou) ESTADO.osEditadas[chave] = { os: t.dataset.os, campo: t.dataset.campo, valor: t.value };
      else delete ESTADO.osEditadas[chave];
      atualizarBotaoSalvarOS();
    };
    t.addEventListener('input', aoMudar);
    t.addEventListener('change', aoMudar);
  });
  c.querySelectorAll('select[data-situacao]').forEach(sel => sel.addEventListener('change', () => alterarSituacaoOS(sel.dataset.situacao, sel)));

function atualizarBotaoSalvarOS() {
  const n = Object.keys(ESTADO.osEditadas).length;
  const btn = el('btn-salvar-os'), aviso = el('os-pendentes');
  if (btn) btn.disabled = !n;
  if (aviso) aviso.textContent = n ? n + ' alteração(ões) pendente(s) em ' + new Set(Object.values(ESTADO.osEditadas).map(x => x.os)).size + ' OS.' : 'Nenhuma alteração pendente.';
}

function salvarAlteracoesOS() {
  const porOs = {};
  Object.values(ESTADO.osEditadas).forEach(x => { (porOs[x.os] = porOs[x.os] || {})[x.campo] = x.valor; });
  const ordens = Object.keys(porOs);
  if (!ordens.length) return;
  const btn = el('btn-salvar-os'), aviso = el('os-pendentes');
  if (btn) { btn.disabled = true; btn.textContent = 'Salvando…'; }
  let feitas = 0, erros = 0;
  const proxima = () => {
    if (!ordens.length) {
      if (btn) { btn.textContent = 'Salvar alterações'; }
      toast(feitas + ' OS gravada(s)' + (erros ? ' • ' + erros + ' com erro' : ''));
      ESTADO.osEditadas = {};
      recarregarAposEdicao(null);
      return;
    }
    const os = ordens.shift();
    if (aviso) aviso.textContent = 'Gravando OS ' + os + '…';
    const run = servidor('salvarCamposOS',
      r => {
        if (r && r.ok) { feitas++; if (r.recusados && r.recusados.length) toast('OS ' + os + ': ' + r.recusados.join(', ') + ' não gravado(s).', true); }
        else { erros++; toast('OS ' + os + ': ' + ((r && r.erro) || 'falha'), true); }
        proxima();
      },
      e => { erros++; toast('OS ' + os + ': ' + (e && e.message ? e.message : e), true); proxima(); });
    if (run) run.salvarCamposOS(ESTADO.token, os, porOs[os]);
    else { erros++; proxima(); }
  };
  proxima();
}


/* ---------------- Documentos da viatura (CRLV e termo) ---------------- */
const DOCS_VIATURA = [
  { tipo: 'crlv', campo: 'linkCrlv', rotulo: 'CRLV', dica: 'Documento do veículo. O painel lê o PDF, confere a placa e grava o Ano Exercício.' },
  { tipo: 'tombamento', campo: 'linkTomb', rotulo: 'Termo de tombamento', dica: 'Termo de responsabilidade patrimonial.' }
];

function secaoDocumentosEdicao(v, porCampo) {
  const cartoes = DOCS_VIATURA.map(d => {
    const info = porCampo[d.campo];
    const atual = v[d.campo];
    const bloqueada = info && !info.editavel;
    return `<div class="doc-slot">
      <div class="doc-cab"><b>${esc(d.rotulo)}</b>${atual ? `<a class="pdf-link" href="${escAttr(atual)}" target="_blank" rel="noopener">${icoPdf()} abrir atual</a>` : '<span class="badge manutencao">sem arquivo</span>'}</div>
      <div class="cartao-dica" style="margin:4px 0 8px">${esc(d.dica)}${info && info.motivo && info.motivo.indexOf('liberado') > 0 ? ' <span style="color:var(--ambar)">Coluna preenchida por script — o painel também grava aqui.</span>' : ''}</div>
      ${bloqueada ? `<div class="foto-data" title="${escAttr(info.motivo)}">coluna bloqueada por fórmula</div>` :
        `<label class="btn claro" style="cursor:pointer; display:inline-flex">${atual ? 'Substituir' : 'Anexar'} PDF
          <input type="file" accept="application/pdf" class="oculto" data-doc="${d.tipo}"></label>
         <div class="foto-data doc-status" id="doc-status-${d.tipo}"></div>`}
    </div>`;
  }).join('');
  return secao('Documentos', `<div class="docs-edicao">${cartoes}</div>
    <div class="cartao-dica">O arquivo vai para a pasta do Drive e o link entra na ConsultaBD. A versão anterior vai para a lixeira do Drive, de onde pode ser recuperada.</div>`);
}

function enviarDocumento(placa, tipo, arquivo) {
  const status = el('doc-status-' + tipo);
  const diga = t => { if (status) status.textContent = t; };
  if (!/pdf$/i.test(arquivo.type) && !/\.pdf$/i.test(arquivo.name)) { toast('Envie um arquivo PDF.'); return; }
  if (arquivo.size > 9 * 1024 * 1024) { toast('PDF acima de 9 MB.'); return; }
  diga('Enviando ' + arquivo.name + '…');
  const leitor = new FileReader();
  leitor.onerror = () => diga('Falha ao ler o arquivo.');
  leitor.onload = () => {
    const base64 = String(leitor.result).substring(String(leitor.result).indexOf(',') + 1);
    const run = servidor('anexarDocumento',
      r => {
        if (!r || !r.ok) { diga(''); toast((r && r.erro) || 'Falha no envio.', true); return; }
        diga('Anexado ✓');
        toast(placa + ': ' + r.detalhe);
        recarregarAposEdicao(placa);
      },
      e => { diga(''); toast('Erro: ' + (e && e.message ? e.message : e), true); });
    if (run) run.anexarDocumento(ESTADO.token, placa, tipo, base64, arquivo.name);
  };
  leitor.readAsDataURL(arquivo);
}


/* ============================================================
   PROCESSO DE PAGAMENTO — abastecimento e manutenção
   ============================================================ */
const TIPO_PROC = { abast: 'Abastecimento', manut: 'Manutenção' };

function renderProcessoPagamento() {
  const c = el('pag-processo'); if (!c) return;
  const tipo = TIPO_PROC[ESTADO.subPag];
  const comp = ESTADO.compProcesso[tipo] || '';
  if (!ESTADO.processo || ESTADO.processo.tipo !== tipo || ESTADO.processo.competencia !== comp) {
    c.innerHTML = '<div class="cartao largo"><div class="vazio"><div class="spinner" style="border-color:#dfe4ee; border-top-color:var(--azul); margin-bottom:10px"></div>Lendo os títulos de ' + esc(tipo) + '…</div></div>';
    const run = servidor('lerProcessoPagamento',
      r => {
        if (!r || !r.ok) {
          if (r && r.competencias && r.competencias.length) { ESTADO.compProcesso[tipo] = r.sugerida || r.competencias[0]; ESTADO.processo = null; renderProcessoPagamento(); return; }
          c.innerHTML = '<div class="cartao largo"><div class="vazio">' + esc((r && r.erro) || 'Falha ao ler.') + '</div></div>'; return;
        }
        if (!r.competencia) { ESTADO.compProcesso[tipo] = r.sugerida || r.competencias[0]; ESTADO.processo = null; renderProcessoPagamento(); return; }
        ESTADO.processo = r; ESTADO.tituloEditado = {};
        desenharProcesso(c, r);
      },
      e => { c.innerHTML = '<div class="cartao largo"><div class="vazio">Erro: ' + esc(String(e && e.message ? e.message : e)) + '</div></div>'; });
    if (run) run.lerProcessoPagamento(ESTADO.token, tipo, comp);
    return;
  }
  desenharProcesso(c, ESTADO.processo);
}

function desenharProcesso(c, r) {
  const t = r.titulo, res = r.resumo;
  const somenteLeitura = r.somenteLeitura || [];
  const ehDinheiro = chave => (r.dinheiro || []).indexOf(chave) >= 0;
  const campo = chave => {
    const rotulo = r.rotulos[chave];
    if (!rotulo) return '';
    const bloqueado = somenteLeitura.indexOf(chave) >= 0;
    const bruto = t[chave];
    // valores em dinheiro com duas casas; título, NF e números do SEI são identificadores, não moeda
    const valor = bruto === null || bruto === undefined ? ''
      : (ehDinheiro(chave) ? (bruto === '' ? '' : fmtDec(_num(bruto)))
                           : String(bruto).replace(/\.0$/, ''));
    return `<div class="form-campo ${chave === 'chave' ? 'largo' : ''}" data-campo="${escAttr(chave)}" data-original="${escAttr(valor)}">
      <label>${esc(rotulo)}${bloqueado ? ' <span style="color:var(--tinta-suave)">fórmula</span>' : ''}</label>
      <input type="text" value="${escAttr(valor)}" class="${ehDinheiro(chave) ? 'num-campo' : ''}" ${bloqueado ? 'disabled' : 'data-t'}></div>`;
  };
  const grupos = r.grupos && r.grupos.length ? r.grupos : [['Dados', Object.keys(r.rotulos)]];
  const etapas = (r.roteiro || []).map(e => {
    const feito = r.etapasFeitas[e.numero];
    return `<div class="etapa ${feito ? 'feita' : ''}">
      <label class="etapa-cab"><input type="checkbox" data-etapa="${e.numero}" ${feito ? 'checked' : ''}>
        <b>${e.numero}. ${esc(e.acao)}</b>${feito ? `<span class="badge disponivel">feito em ${esc(feito.em)}</span>` : ''}</label>
      <div class="etapa-itens">${e.itens.map(i => `<div class="etapa-item"><span class="rot">${esc(i.rotulo)}</span>
        ${i.link ? `<a href="${escAttr(i.valor)}" target="_blank" rel="noopener" class="pdf-link">abrir</a>`
                 : `<span class="val">${esc(i.valor)}</span>${i.valor.length > 3 ? `<button class="link-btn" onclick="copiar(this.previousElementSibling.textContent)">copiar</button>` : ''}`}
      </div>`).join('')}</div></div>`;
  }).join('');

  const feitas = Object.keys(r.etapasFeitas || {}).length;
  const totalEtapas = (r.roteiro || []).length;

  c.innerHTML = `
    <div class="cartao largo" style="margin-bottom:14px">
      <div class="cartao-cab"><h3>Processo de pagamento — ${esc(r.tipo)}</h3><small>título ${esc(t.titulo || '—')} • NF ${esc(t.nf || '—')}</small></div>
      <div class="os-barra-acoes">
        <div class="form-campo" style="margin:0"><label>Competência</label>
          <select id="proc-comp">${(r.competencias || []).map(x => `<option value="${escAttr(x)}" ${x === r.competencia ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
        ${r.linkNota ? `<a class="btn claro" href="${escAttr(r.linkNota)}" target="_blank" rel="noopener" style="text-decoration:none">${icoPdf()} Nota fiscal da competência</a>` : '<span class="form-aviso">Nota fiscal ainda não importada nesta competência.</span>'}
        <span class="form-aviso">Roteiro: ${feitas} de ${totalEtapas} etapas concluídas.</span>
      </div>
    </div>

    <div class="kpis">
      ${kpi('Valor bruto', fmtMoeda(res.bruto), 'NF ' + esc(t.nf || ''), '', null, true)}
      ${r.tipo === 'Abastecimento'
        ? kpi('Desconto contratual', fmtMoeda(res.desconto), '4,67%', 'verde', null, true) + kpi('Glosas', fmtMoeda(res.glosaIMR + res.glosaPrecos), 'IMR ' + fmtMoeda(res.glosaIMR) + ' • preços ' + fmtMoeda(res.glosaPrecos), res.glosaPrecos ? 'ambar' : '', null, true)
        : kpi('Peças · mão de obra', fmtMoeda(res.pecas) + ' · ' + fmtMoeda(res.mo), 'acidente ' + fmtMoeda(res.pecasAcid + res.moAcid), '', null, true) + kpi('Glosa IMR', fmtMoeda(res.glosaIMR), '', res.glosaIMR ? 'ambar' : '', null, true)}
      ${kpi('Valor líquido', fmtMoeda(res.liquido), 'a liquidar', 'ciano', null, true)}
      ${kpi('Nota de pagamento', esc(t.notaPagamento || '—'), 'SEI ' + esc(t.sei || '—'), t.notaPagamento ? 'verde' : 'vermelho', null, true)}
    </div>

    <div class="grade" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">
      <div class="cartao largo" style="grid-column:1/-1">
        <div class="cartao-cab"><h3>Dados do título</h3><small>edite e salve — grava direto na planilha de pagamentos</small></div>
        ${grupos.map(g => `<div class="grupo-campos"><div class="grupo-titulo">${esc(g[0])}</div>
          <div class="form-grade">${g[1].map(campo).join('')}</div></div>`).join('')}
        <div class="form-acoes">
          <button class="btn amarelo" id="btn-salvar-titulo" disabled>Salvar alterações</button>

        </div>

      <div class="cartao">
        <div class="cartao-cab"><h3>Composição do valor</h3><small>como vai no termo de atesto</small></div>

        <div class="cartao-dica">Por extenso: ${esc(extensoLocal(res.liquido))}</div>
      </div>

      <div class="cartao">
        <div class="cartao-cab"><h3>Documentos do processo</h3><small>gerados a partir dos modelos</small></div>

        <button class="btn amarelo" id="btn-gerar-docs">Gerar documentos</button>

        ${(r.modelos && r.modelos.length) ? `<div class="modelos-links">
          <div class="grupo-titulo" style="margin-top:12px">Modelos</div>
          <div class="cartao-dica" style="margin:0 0 6px">Abra para editar o texto do documento. O que você mudar aqui vale para as próximas gerações.</div>
          ${r.modelos.map(m => `<a class="btn claro" href="${escAttr(m.url)}" target="_blank" rel="noopener" style="text-decoration:none; width:100%; justify-content:flex-start; margin-bottom:5px">✏️ ${esc(m.nome)}</a>`).join('')}
          ${r.pastaSaida ? `<a class="btn claro" href="${escAttr(r.pastaSaida)}" target="_blank" rel="noopener" style="text-decoration:none; width:100%; justify-content:flex-start">📁 Pasta dos documentos gerados</a>` : ''}
        </div>` : ''}

    </div>

    <div class="cartao largo" style="margin-top:14px">
      <div class="cartao-cab"><h3>Roteiro do processo</h3><small>marque conforme for concluindo — fica registrado por competência</small></div>
      <div class="roteiro">${etapas || '<div class="vazio">Roteiro não encontrado nesta aba</div>'}</div>
    </div>`;

  // documentos disponíveis para o tipo
  const docs = r.tipo === 'Abastecimento'

  htm('proc-docs', docs.map(d => `<label><input type="checkbox" value="${escAttr(d)}" checked> ${esc(d)}</label>`).join(''));

  ouvir('proc-comp', 'change', () => {

  c.querySelectorAll('.form-campo[data-campo] input[data-t]').forEach(i => {

      if (aviso) aviso.textContent = n ? n + ' campo(s) alterado(s).' : 'Nenhuma alteração pendente.';

  c.querySelectorAll('input[data-etapa]').forEach(chk => chk.addEventListener('change', () => {

/** Valor por extenso (mesma regra do servidor) para exibir na tela. */
/** Número a partir de texto em formato brasileiro. */
function _num(v) {
  if (typeof v === 'number') return v;
  const t = String(v === null || v === undefined ? '' : v).replace(/[R$\s]/g, '');
  if (!t) return 0;
  return parseFloat(t.indexOf(',') >= 0 ? t.replace(/\./g, '').replace(',', '.') : t) || 0;
}

function extensoLocal(valor) {
  const u = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove'];
  const e = ['dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
  const d = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
  const ce = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];
  const p = (Number(valor) || 0).toFixed(2).split('.');
  const reais = parseInt(p[0], 10), cent = parseInt(p[1], 10);
  const f = n => {
    if (n === 0) return '';
    if (n === 100) return 'cem';
    if (n < 10) return u[n];
    if (n < 20) return e[n - 10];
    if (n < 100) return d[Math.floor(n / 10)] + (n % 10 ? ' e ' + u[n % 10] : '');
    if (n < 1000) return ce[Math.floor(n / 100)] + (n % 100 ? ' e ' + f(n % 100) : '');
    if (n < 1000000) { const m = Math.floor(n / 1000), r = n % 1000; return (m > 1 ? f(m) + ' mil' : 'mil') + (r ? ' e ' + f(r) : ''); }
    const mi = Math.floor(n / 1000000), r = n % 1000000;
    return (mi > 1 ? f(mi) + ' milhões' : 'um milhão') + (r ? ' e ' + f(r) : '');
  };
  const a = reais ? f(reais) + (reais === 1 ? ' real' : ' reais') : '';
  const b = cent ? f(cent) + (cent === 1 ? ' centavo' : ' centavos') : '';
  return a + (b ? (a ? ' e ' : '') + b : '');
}

/** Cor do status conforme a formatação condicional da planilha. */
function estiloStatus(status) {
  const cores = (ESTADO.multas && ESTADO.multas.coresStatus) || [];
  const alvo = String(status || '').trim().toLowerCase();
  if (!alvo) return '';
  let achou = cores.find(c => String(c.texto).trim().toLowerCase() === alvo);
  if (!achou) achou = cores.find(c => c.contem && alvo.indexOf(String(c.texto).trim().toLowerCase()) >= 0);
  if (!achou) return '';
  const partes = [];
  if (achou.fundo) partes.push('background:' + achou.fundo);
  if (achou.fonte) partes.push('color:' + achou.fonte);
  if (achou.fundo) partes.push('border-color:' + achou.fundo);
  return partes.join(';');
}

function classeStatus(st) {
  const t = String(st || '').toLowerCase();
  if (/^deferido/.test(t)) return 'deferido';
  if (/indeferido/.test(t)) return 'indeferido';
  if (t) return 'andamento';
  return '';
}

/** Troca o status direto na tabela e grava na planilha na hora. */
function alterarStatusMulta(linha, sel) {
  const anterior = ESTADO.multas.multas.find(m => m.linha === linha);
  const valorAnterior = anterior ? anterior.status : '';
  const novo = sel.value;
  sel.disabled = true;
  sel.style.cssText = estiloStatus(novo);
  const run = servidor('salvarMulta',
    r => {
      sel.disabled = false;
      if (!r || !r.ok) {
        sel.value = valorAnterior;
        sel.style.cssText = estiloStatus(valorAnterior);
        toast((r && r.erro) || 'Falha ao gravar o status.', true);
        return;
      }
      if (r.item) aplicarMultaLocal(r.item);
      else if (anterior) anterior.status = novo;
      toast('Status de ' + (anterior ? anterior.ai || 'multa' : 'multa') + ': ' + (novo || 'sem status'));
      renderMultas();
    },
    e => {
      sel.disabled = false;
      sel.value = valorAnterior;
      sel.style.cssText = estiloStatus(valorAnterior);
      toast('Erro: ' + (e && e.message ? e.message : e), true);
    });
  if (run) run.salvarMulta(ESTADO.token, linha, { status: novo });
}

/* ---------------- formulário de multa ---------------- */
function abrirFormMulta(linha) {
  const dados = ESTADO.multas;
  const m = linha ? dados.multas.find(x => x.linha === linha) : null;
  const campo = (chave, tipo, opcoes) => {
    let valor = m ? (m[chave] || '') : '';
    if (/^data/i.test(chave)) valor = dataBR(valor);
    const rotulo = dados.rotulos[chave] || chave;
    if (tipo === 'select') {
      return `<div class="form-campo" data-campo="${chave}">
        <label>${esc(rotulo)}</label>
        <select data-m><option value=""></option>${opcoes.map(o => `<option value="${escAttr(o.valor)}" ${o.valor === valor || o.sigla === valor ? 'selected' : ''}>${esc(o.nome)}</option>`).join('')}</select></div>`;
    }
    if (tipo === 'opcoes') {   // lista fechada vinda da base de dados
      const tem = opcoes.some(o => o === valor);
      return `<div class="form-campo ${chave === 'enquadramento' ? 'largo' : ''}" data-campo="${chave}">
        <label>${esc(rotulo)} <span style="color:var(--tinta-suave); font-weight:500">${opcoes.length} opção(ões)</span></label>
        <select data-m>
          <option value="">— selecione —</option>
          ${opcoes.map(o => `<option value="${escAttr(o)}" ${o === valor ? 'selected' : ''}>${esc(o)}</option>`).join('')}
          ${valor && !tem ? `<option value="${escAttr(valor)}" selected>${esc(valor)} (fora da lista)</option>` : ''}
        </select></div>`;
    }
    if (tipo === 'lista') {
      return `<div class="form-campo" data-campo="${chave}">
        <label>${esc(rotulo)}</label>
        <input type="text" value="${escAttr(valor)}" list="lista-${chave}" data-m>
        <datalist id="lista-${chave}">${opcoes.map(o => `<option value="${escAttr(o)}">`).join('')}</datalist></div>`;
    }
    return `<div class="form-campo ${chave === 'observacoes' ? 'largo' : ''}" data-campo="${chave}">
      <label>${esc(rotulo)}</label><input type="text" value="${escAttr(valor)}" data-m></div>`;
  };

  const corpo = secao('Notificação', `<div class="form-grade">
      ${campo('tipo', 'select', dados.tipos.map(t => ({ valor: t.sigla, sigla: t.sigla, nome: t.nome })))}
      ${campo('dataInfracao')}${campo('ai')}${campo('aiOriginario')}
      ${campo('placa', 'lista', dados.bases.outrasVtrs.map(o => o.placa).concat(ESTADO.veiculos.map(v => v.placa)))}
      ${campo('orgao', 'opcoes', dados.bases.orgaos.map(o => o.orgao))}
      ${campo('enquadramento', 'opcoes', dados.bases.enquadramentos.map(e => e.enquadramento))}
    </div>`) +
    secao('Processo', `<div class="form-grade">
      ${campo('processo')}${campo('protocolo')}${campo('dataDefesa')}
      ${campo('status', 'opcoes', dados.bases.status)}${campo('observacoes')}
    </div>`) +
    (m ? blocoViaturaMulta(m) : '');

  htm('gaveta-cab', `<div class="titulo"><h2>${m ? 'Editar multa ' + esc(m.ai) : 'Nova multa'}</h2>
    <div class="sub">${m ? esc(m.placa + ' · ' + (m.orgao || '')) : 'registro na planilha de multas'}</div></div>
    <button class="gaveta-fechar" onclick="fecharFicha()">×</button>`);
  htm('gaveta-corpo', corpo + `<div class="form-acoes">
      <button class="btn amarelo" id="btn-salvar-multa">${m ? 'Salvar' : 'Cadastrar'}</button>
      <button class="btn claro" onclick="fecharFicha()">Cancelar</button>
      ${m ? `<span class="form-aviso">Lançada em ${esc(dataBR(m.lancamento) || '—')}</span>` : ''}
    </div>`);
  cls('gaveta-fundo', 'aberta', true); cls('gaveta', 'aberta', true);
  document.body.style.overflow = 'hidden';
  ouvir('btn-salvar-multa', 'click', () => {
    const campos = {};
    document.querySelectorAll('#gaveta-corpo .form-campo[data-campo]').forEach(fc => {
      const i = fc.querySelector('[data-m]');
      if (i) campos[fc.dataset.campo] = i.value;
    });
    if (!campos.ai && !campos.placa) { toast('Informe ao menos o AI ou a placa.'); return; }
    const btn = el('btn-salvar-multa');
    btn.disabled = true; btn.textContent = 'Gravando…';
    const run = servidor('salvarMulta',
      r => {
        if (!r || !r.ok) { btn.disabled = false; btn.textContent = 'Salvar'; toast((r && r.erro) || 'Falha ao gravar.', true); return; }
        toast(r.novo ? 'Multa cadastrada.' : r.gravados.length + ' campo(s) gravado(s).');
        aplicarMultaLocal(r.item);          // atualiza a tela sem reler a planilha inteira
        fecharFicha(); renderMultas();
      },
      e => { btn.disabled = false; btn.textContent = 'Salvar'; toast('Erro: ' + (e && e.message ? e.message : e), true); });
    if (run) run.salvarMulta(ESTADO.token, linha || 0, campos);
  });
}

function gerarDefesa(linha, botao) {
  if (botao) { botao.disabled = true; botao.textContent = 'gerando…'; }
  const run = servidor('gerarDefesaMulta',
    r => {
      if (botao) { botao.disabled = false; botao.textContent = 'gerar'; }
      if (!r || !r.ok) { toast((r && r.erro) || 'Falha ao gerar a defesa.', true); return; }
      toast('Defesa gerada: ' + r.nome + (r.substituidas ? ' (substituiu ' + r.substituidas + ' anterior)' : ''));
      window.open(r.url, '_blank');
      const alvo = ESTADO.multas.multas.find(x => x.linha === linha);
      if (alvo) { alvo.linkDefesa = r.url; if (!alvo.dataDefesa) alvo.dataDefesa = new Date().toLocaleDateString('pt-BR'); }
      renderMultas();
    },
    e => { if (botao) { botao.disabled = false; botao.textContent = 'gerar'; } toast('Erro: ' + (e && e.message ? e.message : e), true); });
  if (run) run.gerarDefesaMulta(ESTADO.token, linha);
}

/** Edição de um item das bases, na gaveta lateral. */
function editarItemBase(tipo, item) {
  if (!item) return;
  const campos = tipo === 'orgao'
    ? [['orgao', 'Órgão', item.orgao, 'input'], ['gestor', 'Gestor (como aparece no ofício)', item.gestor, 'textarea']]
    : tipo === 'enquadramento'
      ? [['enquadramento', 'Enquadramento', item.enquadramento, 'input'], ['descricao', 'Descrição', item.descricao, 'textarea'], ['modelo', 'ID do documento modelo', item.modelo, 'input']]
      : [['placa', 'Placa', item.placa, 'input'], ['modelo', 'Marca/Modelo', item.modelo, 'input']];
  const chaveOriginal = tipo === 'orgao' ? item.orgao : tipo === 'enquadramento' ? item.enquadramento : item.placa;

  htm('gaveta-cab', `<div class="titulo"><h2>Editar ${tipo === 'orgao' ? 'órgão' : tipo === 'enquadramento' ? 'enquadramento' : 'viatura'}</h2>
    <div class="sub">${esc(chaveOriginal)}</div></div><button class="gaveta-fechar" onclick="fecharFicha()">×</button>`);
  htm('gaveta-corpo', secao('Dados', `<div class="form-grade">${campos.map(([k, rot, valor, tipoCampo]) => `
      <div class="form-campo ${tipoCampo === 'textarea' ? 'largo' : ''}" data-campo="${k}">
        <label>${esc(rot)}</label>
        ${tipoCampo === 'textarea' ? `<textarea rows="3" data-b>${esc(valor || '')}</textarea>` : `<input type="text" value="${escAttr(valor || '')}" data-b>`}
      </div>`).join('')}</div>`) +
    `<div class="form-acoes"><button class="btn amarelo" id="btn-salvar-base">Salvar</button>
      <button class="btn claro" onclick="fecharFicha()">Cancelar</button>
      ${tipo === 'enquadramento' && item.modelo ? `<a class="btn claro" href="https://docs.google.com/document/d/${escAttr(item.modelo)}/edit" target="_blank" rel="noopener" style="text-decoration:none">Abrir modelo</a>` : ''}
    </div>`);
  cls('gaveta-fundo', 'aberta', true); cls('gaveta', 'aberta', true);
  document.body.style.overflow = 'hidden';
  ouvir('btn-salvar-base', 'click', () => {
    const dados = {};
    document.querySelectorAll('#gaveta-corpo .form-campo[data-campo]').forEach(fc => {
      const i = fc.querySelector('[data-b]');

    });
    const btn = el('btn-salvar-base');
    btn.disabled = true; btn.textContent = 'Gravando…';
    const run = servidor('editarBaseMulta',
      r => {
        if (!r || !r.ok) { btn.disabled = false; btn.textContent = 'Salvar'; toast((r && r.erro) || 'Falha.', true); return; }
        toast('Cadastro atualizado.');
        if (r.bases) ESTADO.multas.bases = r.bases; else ESTADO.multas = null;
        fecharFicha(); renderMultas();
      },
      e => { btn.disabled = false; btn.textContent = 'Salvar'; toast('Erro: ' + (e && e.message ? e.message : e), true); });
    if (run) run.editarBaseMulta(ESTADO.token, tipo, chaveOriginal, dados);
  });
}

/** Viatura correspondente a uma placa da multa (frota ou cadastro de fora). */
function viaturaDaMulta(placa) {
  if (!placa) return null;
  const p = String(placa).replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  return (ESTADO.veiculos || []).find(v => v.placa === p || v.placaMerc === p || v.placaRes === p) || null;
}

/** Painel com os dados da viatura dentro da ficha da multa. */
function blocoViaturaMulta(m) {
  const v = viaturaDaMulta(m.placa);
  if (!v) {
    const fora = (ESTADO.multas.bases.outrasVtrs || []).find(o => o.placa === m.placa);
    return secao('Viatura', fora
      ? `<div class="grade-dados">
           <div class="dado"><div class="k">Placa</div><div class="v">${esc(fora.placa)}</div></div>
           <div class="dado"><div class="k">Marca/Modelo</div><div class="v" style="font-size:14px">${esc(fora.modelo || '—')}</div></div>
           <div class="dado"><div class="k">Origem</div><div class="v" style="font-size:14px">fora da frota</div></div>
         </div><div class="cartao-dica">Cadastrada em "Viaturas de fora da frota". Edite em Multas → Cadastros.</div>`
      : `<div class="cartao-dica">A placa ${esc(m.placa || '')} não está na ConsultaBD nem no cadastro de viaturas de fora da frota. Cadastre em Multas → Cadastros para que a marca/modelo saia no ofício.</div>`);
  }
  const d = (k, valor) => `<div class="dado"><div class="k">${k}</div><div class="v" style="font-size:14px">${esc(valor || '—')}</div></div>`;
  return secao('Viatura', `
    <div class="grade-dados">
      ${d('Placa', v.placa)}${d('Marca/Modelo', v.modelo)}${d('Unidade SIPAC', v.unidade)}
      ${d('Uso', v.uso)}${d('Status', v.status)}${d('Ano', (v.anoFab || '') + (v.anoMod ? '/' + v.anoMod : ''))}
      ${d('Cor', v.cor)}${d('Renavam', v.renavam)}${d('Tombamento', v.tombamento)}
      ${d('Exercício', v.anoEx)}${d('Licenciamento', v.licStatus)}${d('Gestor da unidade', v.gestorNome)}
    </div>
    <div class="form-acoes" style="margin-top:8px">
      <button class="btn claro" onclick="fecharFicha(); setTimeout(function(){ abrirFicha('${escAttr(v.placa)}'); }, 120)">Abrir ficha completa da viatura</button>
    </div>
    ${v.multasTxt ? `<div class="cartao-dica">Multas registradas na consulta da viatura: ${esc(String(v.multasTxt).substring(0, 220))}${String(v.multasTxt).length > 220 ? '…' : ''}</div>` : ''}`);
}

/* ---------------- análise das multas ---------------- */
function renderAnaliseMultas(c) {
  const todas = ESTADO.multas.multas.map(m => {
    const v = viaturaDaMulta(m.placa);
    return Object.assign({}, m, {
      unidade: v ? (v.unidadeCurta || v.unidade || 'Sem unidade') : 'Fora da frota',
      uso: v ? (v.uso || 'Sem uso') : 'Fora da frota',
      modelo: v ? (v.modeloCurto || v.modelo || '—') : '—',
      ano: (String(m.dataInfracao || '').match(/\d{2}\/\d{2}\/(\d{4})/) || [])[1] || 'sem data'
    });
  });
  const agrupar = chave => {
    const mapa = new Map();
    todas.forEach(m => { const k = m[chave] || '—'; mapa.set(k, (mapa.get(k) || 0) + 1); });
    return Array.from(mapa.entries()).sort((a, b) => b[1] - a[1]);
  };
  const porAno = Array.from(todas.reduce((mapa, m) => mapa.set(m.ano, (mapa.get(m.ano) || 0) + 1), new Map()).entries())
    .sort((a, b) => a[0].localeCompare(b[0]));
  const barras = (itens, cor, limite) => {
    const lista = itens.slice(0, limite || 12);
    const maximo = Math.max(1, ...lista.map(i => i[1]));
    return lista.map(([k, v]) => `<button class="barra" style="cursor:default"><span class="rotulo">${esc(k)}</span>
      <span class="trilha"><span class="preench" style="width:${Math.round(v / maximo * 100)}%; background:${cor}"></span></span>
      <span class="valor">${v}</span></button>`).join('') || '<div class="vazio">Sem dados</div>';
  };
  const deferido = todas.filter(m => classeStatus(m.status) === 'deferido').length;
  const indeferido = todas.filter(m => classeStatus(m.status) === 'indeferido').length;
  const julgadas = deferido + indeferido;

  c.innerHTML = `
    <div class="kpis">
      ${kpi('Total de processos', todas.length, 'de ' + esc(String(ESTADO.multas.anoInicial)) + ' em diante', '', null, true)}
      ${kpi('Viaturas envolvidas', new Set(todas.map(m => m.placa).filter(Boolean)).size, 'placas distintas', '', null, true)}
      ${kpi('Unidades atingidas', new Set(todas.map(m => m.unidade)).size, 'com ao menos uma multa', '', null, true)}
      ${kpi('Índice de êxito', julgadas ? fmtDec(deferido / julgadas * 100) + '%' : '—', deferido + ' de ' + julgadas + ' julgadas', julgadas && deferido / julgadas > 0.5 ? 'verde' : 'ambar', null, true)}
      ${kpi('Ainda em cobrança', todas.filter(m => m.cobrada).length, 'constam na consulta da viatura', 'vermelho', null, true)}
    </div>

    <div class="grade" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
      <div class="cartao"><div class="cartao-cab"><h3>Por ano da infração</h3></div><div class="barras compacto">${barras(porAno, 'var(--azul)', 20)}</div></div>
      <div class="cartao"><div class="cartao-cab"><h3>Por unidade SIPAC</h3><small>cruzado com a ConsultaBD</small></div><div class="barras compacto" style="max-height:260px; overflow:auto">${barras(agrupar('unidade'), 'var(--ambar)')}</div></div>
      <div class="cartao"><div class="cartao-cab"><h3>Por órgão autuador</h3></div><div class="barras compacto" style="max-height:260px; overflow:auto">${barras(agrupar('orgao'), 'var(--roxo, #7D5BA6)')}</div></div>
      <div class="cartao"><div class="cartao-cab"><h3>Por enquadramento</h3></div><div class="barras compacto" style="max-height:260px; overflow:auto">${barras(agrupar('enquadramento'), 'var(--ciano, #00A3B5)')}</div></div>
      <div class="cartao"><div class="cartao-cab"><h3>Viaturas mais autuadas</h3></div><div class="barras compacto" style="max-height:260px; overflow:auto">${barras(agrupar('placa'), 'var(--vermelho)')}</div></div>
      <div class="cartao"><div class="cartao-cab"><h3>Por uso SIPAC</h3></div><div class="barras compacto">${barras(agrupar('uso'), 'var(--verde)')}</div></div>
    </div>

    <div class="cartao largo" style="margin-top:14px">
      <div class="cartao-cab"><h3>Unidades com mais processos</h3><small>situação de cada uma</small></div>
      <div class="tabela-rol" style="max-height:320px"><table class="tabela-simples" style="width:100%">
        <thead><tr><th>Unidade</th><th class="num">Processos</th><th class="num">Viaturas</th><th class="num">Deferidas</th><th class="num">Indeferidas</th><th class="num">Em cobrança</th></tr></thead>
        <tbody>${agrupar('unidade').map(([u]) => {
          const doGrupo = todas.filter(m => m.unidade === u);
          return `<tr><td>${esc(u)}</td><td class="num">${doGrupo.length}</td>
            <td class="num">${new Set(doGrupo.map(m => m.placa).filter(Boolean)).size}</td>
            <td class="num">${doGrupo.filter(m => classeStatus(m.status) === 'deferido').length}</td>
            <td class="num">${doGrupo.filter(m => classeStatus(m.status) === 'indeferido').length}</td>
            <td class="num">${doGrupo.filter(m => m.cobrada).length}</td></tr>`;
        }).join('')}</tbody></table></div>
    </div>`;
  ajustarKpis();
}


/** Insere ou substitui um registro na lista já carregada, refazendo os vínculos. */
function aplicarMultaLocal(item) {
  if (!item || !ESTADO.multas) return;
  const lista = ESTADO.multas.multas;
  const i = lista.findIndex(x => x.linha === item.linha);
  const anterior = i >= 0 ? lista[i] : null;
  if (anterior) {   // preserva o que o servidor não recalcula neste retorno
    item.cobrada = anterior.cobrada; item.consultaEm = anterior.consultaEm; item.valorMulta = anterior.valorMulta;
  }
  if (i >= 0) lista[i] = item; else lista.push(item);
  recalcularVinculosMultas();
}

/** Recalcula, no navegador, os vínculos entre autuação, penalidade e AI originário. */
function recalcularVinculosMultas() {
  const lista = ESTADO.multas.multas;
  const porProcesso = {}, porAi = {};
  lista.forEach(m => {
    if (m.processo) (porProcesso[m.processo] = porProcesso[m.processo] || []).push(m.ai);
    if (m.ai) porAi[m.ai] = m;
  });
  lista.forEach(m => {
    m.irmas = (porProcesso[m.processo] || []).filter(x => x && x !== m.ai);
    const orig = m.aiOriginario ? porAi[m.aiOriginario] : null;
    m.origem = orig ? { ai: orig.ai, enquadramento: orig.enquadramento, status: orig.status, data: orig.dataInfracao } : null;
    m.derivadas = lista.filter(x => x.aiOriginario && x.aiOriginario === m.ai).map(x => x.ai);
  });
}


/** Datas da planilha em formatos variados (d/m/aaaa, dd/mm/aa, aaaa-mm-dd) → dd/mm/aaaa. */
function dataBR(valor) {
  const t = String(valor === null || valor === undefined ? '' : valor).trim();
  if (!t) return '';
  let m = t.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (m) {
    const ano = m[3].length === 2 ? (parseInt(m[3], 10) > 50 ? '19' + m[3] : '20' + m[3]) : m[3];
    return ('0' + m[1]).slice(-2) + '/' + ('0' + m[2]).slice(-2) + '/' + ano;
  }
  m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[3] + '/' + m[2] + '/' + m[1];
  return t;
}


/** Gira a foto 90° à direita e regrava. A imagem vem do servidor porque o
    Drive não permite ler a imagem direto no navegador (política de origem). */
function girarFoto(placa, ang, botao) {
  const status = el('foto-status-' + ang);
  const diga = t => { if (status) status.textContent = t; };
  if (botao) { botao.disabled = true; botao.textContent = 'girando…'; }
  diga('Baixando a foto…');
  const restaurar = () => { if (botao) { botao.disabled = false; botao.textContent = '⟳ Girar'; } };

  const run = servidor('obterFotoViatura',
    r => {
      if (!r || !r.ok) { restaurar(); diga(''); toast((r && r.erro) || 'Não consegui ler a foto.', true); return; }
      const img = new Image();
      img.onerror = () => { restaurar(); diga(''); toast('Arquivo não é uma imagem válida.', true); };
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = img.height; c.height = img.width;               // 90° troca largura e altura
        const ctx = c.getContext('2d');
        ctx.translate(c.width / 2, c.height / 2);
        ctx.rotate(Math.PI / 2);
        ctx.drawImage(img, -img.width / 2, -img.height / 2);
        const dataUrl = c.toDataURL('image/jpeg', 0.85);
        const base64 = dataUrl.substring(dataUrl.indexOf(',') + 1);
        diga('Salvando…');
        const run2 = servidor('salvarFotoViatura',
          r2 => {
            restaurar();
            if (!r2 || !r2.ok) { diga(''); toast((r2 && r2.erro) || 'Falha ao salvar.', true); return; }
            diga('Girada ✓');
            const slot = document.querySelector('.foto-slot[data-ang="' + ang + '"] .foto img');
            if (slot) slot.src = dataUrl;                          // mostra o resultado sem esperar o Drive
            toast(placa + ': foto ' + ang + ' girada.');
            recarregarAposEdicao(placa);
          },
          e => { restaurar(); diga(''); toast('Erro: ' + (e && e.message ? e.message : e), true); });
        if (run2) run2.salvarFotoViatura(ESTADO.token, placa, ang, base64, 'image/jpeg');
      };
      img.src = 'data:' + (r.tipoMime || 'image/jpeg') + ';base64,' + r.base64;
    },
    e => { restaurar(); diga(''); toast('Erro: ' + (e && e.message ? e.message : e), true); });
  if (run) run.obterFotoViatura(ESTADO.token, placa, ang);
}


/** Situações existentes na aba OS, para a lista de seleção da tabela. */
function statusOSDisponiveis() {
  if (ESTADO._statusOS) return ESTADO._statusOS;
  const vistos = new Set();
  (ESTADO.dados.os || []).forEach(o => { if (o.status) vistos.add(o.status); });
  NIVEIS_OS.forEach(n => {
    const achado = Array.from(vistos).find(s => n.re.test(s));
    if (!achado) return;
  });
  ESTADO._statusOS = Array.from(vistos).sort((a, b) => pesoNivel(nivelDaOS(a)) - pesoNivel(nivelDaOS(b)) || a.localeCompare(b, 'pt-BR'));
  return ESTADO._statusOS;
}

/** Troca a situação da OS e grava na planilha imediatamente. */
function alterarSituacaoOS(os, sel) {
  const registro = (ESTADO.dados.os || []).find(o => String(o.os) === String(os) && o.origem === 'PENDENTE');
  const anterior = registro ? registro.status : '';
  const novo = sel.value;
  if (novo === anterior) return;
  sel.disabled = true;
  const campo = sel.closest('.situacao-campo');
  if (campo) campo.classList.add('gravando');
  const run = servidor('salvarCamposOS',
    r => {
      sel.disabled = false;
      if (campo) campo.classList.remove('gravando');
      if (!r || !r.ok) { sel.value = anterior; toast((r && r.erro) || 'Falha ao gravar a situação.', true); return; }
      if (r.recusados && r.recusados.length) { sel.value = anterior; toast('OS ' + os + ': ' + r.recusados.join(', '), true); return; }
      if (registro) registro.status = novo;
      ESTADO._statusOS = null;
      toast('OS ' + os + ': ' + (novo || 'sem situação'));
      renderOS(ESTADO.filtrado);
    },
    e => { sel.disabled = false; if (campo) campo.classList.remove('gravando'); sel.value = anterior; toast('Erro: ' + (e && e.message ? e.message : e), true); });
  if (run) run.salvarCamposOS(ESTADO.token, os, { status: novo });
}
