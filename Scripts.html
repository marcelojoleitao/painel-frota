    ).join('') || `<tr><td colspan="${cab.length}"><div class="vazio">Nenhum título no período</div></td></tr>`}</tbody></table></div>`;
  return card;
}

  ['Gestão', ['sugDesf', 'desf', 'statusInv', 'obsInv', 'obsCessao']]
];
const CAMPOS_SUGESTAO = ['unidade', 'uso', 'status', 'tipo', 'categoria', 'especie', 'cor', 'comb', 'blind', 'carac', 'prop', 'freq', 'sugDesf', 'unidTomb', 'crvFisico', 'nacionalidade', 'statusInv'];
const CAMPOS_LONGOS = ['obsInv', 'obsCessao', 'desf', 'linkTomb', 'linkCrlv', 'modelo'];
const OBRIGATORIOS_PADRAO = ['placa', 'modelo', 'tipo', 'categoria', 'especie', 'cor', 'comb', 'anoFab', 'anoMod', 'chassi', 'renavam', 'blind', 'carac'];
function camposObrigatorios() { return ESTADO.dados.edicaoObrigatorios || OBRIGATORIOS_PADRAO; }

function _valorAtualCampo_(v, campo) {
  if (!v) return '';
  if (campo.indexOf('foto') === 0) return (v.fotos && v.fotos[campo.substring(4)]) || '';
  const x = v[campo];
  return x === null || x === undefined ? '' : String(x);
}

function abrirFormViatura(placa) {
  const edicao = ESTADO.dados.edicao || [];
  if (!ESTADO.admin || !edicao.length) { toast('Edição disponível apenas para o administrador.'); return; }
  const porCampo = {}; edicao.forEach(e => { if (e.campo) porCampo[e.campo] = e; });
  const v = placa ? ESTADO.veiculos.find(x => x.placa === placa) : null;
  if (placa && !v) return;
  const novo = !placa;

  // sugestões por campo (valores já usados na frota)
  const sugestoes = {};
  CAMPOS_SUGESTAO.forEach(c => {
    const m = new Map();
    ESTADO.veiculos.forEach(x => { const val = _valorAtualCampo_(x, c); if (val) m.set(val, (m.get(val) || 0) + 1); });
    sugestoes[c] = Array.from(m.keys()).sort((a, b) => m.get(b) - m.get(a)).slice(0, 40);
  });

  const usados = new Set();
  const campoHtml = campo => {
    const info = porCampo[campo];
    if (!info || !info.editavel) return '';
    usados.add(campo);
    const atual = novo ? '' : _valorAtualCampo_(v, campo);
    const chave = escAttr(campo);
    if (campo === 'placa' && !novo)
      return `<div class="form-campo"><label>${esc(info.nome)}</label><input value="${escAttr(atual)}" disabled title="A placa identifica a linha e não é alterada por aqui"></div>`;
    const obrig = novo && camposObrigatorios().indexOf(campo) >= 0;
    const numero = ['anoFab', 'anoMod', 'anoEx', 'odometro', 'qtdAbast'].indexOf(campo) >= 0;
    const lista = sugestoes[campo] ? `list="sug-${chave}"` : '';
    const longo = CAMPOS_LONGOS.indexOf(campo) >= 0;
    return `<div class="form-campo ${longo ? 'largo' : ''}" data-campo="${chave}" data-original="${escAttr(atual)}">
      <label>${esc(info.nome)}${(campo === 'placa' && novo) || obrig ? ' <span class="obrig">*</span>' : ''}</label>
      ${longo && campo.indexOf('obs') === 0 ? `<textarea rows="2" data-e>${esc(atual)}</textarea>` : `<input ${numero ? 'type="number" inputmode="numeric"' : 'type="text"'} value="${escAttr(atual)}" ${lista} data-e ${campo === 'placa' ? 'style="text-transform:uppercase"' : ''} ${obrig || (campo === 'placa' && novo) ? 'data-obrig' : ''}>`}
      ${sugestoes[campo] ? `<datalist id="sug-${chave}">${sugestoes[campo].map(o => `<option value="${escAttr(o)}">`).join('')}</datalist>` : ''}
    </div>`;
  };

  let corpo = '';
  GRUPOS_EDICAO.forEach(([titulo, campos]) => {
    const html = campos.map(campoHtml).filter(Boolean).join('');
    if (html) corpo += secao(titulo, `<div class="form-grade">${html}</div>`);
  });
  const soltos = edicao.filter(e => e.campo && e.editavel && !usados.has(e.campo) && e.campo !== 'placa' && e.campo.indexOf('foto') !== 0).map(e => campoHtml(e.campo)).filter(Boolean).join('');
  if (soltos) corpo += secao('Outros campos editáveis', `<div class="form-grade">${soltos}</div>`);
  if (!novo) corpo += secaoFotosEdicao(v, porCampo);
  const bloqueadas = edicao.filter(e => !e.editavel).length;

  htm('gaveta-cab', `
    <div class="titulo"><h2>${novo ? 'Cadastrar nova viatura' : 'Editar ' + esc(v.placa) + ' — ' + esc(v.modeloCurto)}</h2>
      <div class="sub">${novo ? 'A linha nova replica as fórmulas da ConsultaBD automaticamente' : esc(v.unidade || '')}</div></div>
    <button class="gaveta-fechar" onclick="${novo ? 'fecharFicha()' : `abrirFicha('${escAttr(v.placa)}')`}" title="Voltar sem salvar">×</button>`);
  htm('gaveta-corpo', corpo + `
    <div class="form-acoes">
      <button class="btn amarelo" id="btn-salvar-viatura">${novo ? 'Cadastrar viatura' : 'Salvar alterações'}</button>
      <button class="btn claro" onclick="${novo ? 'fecharFicha()' : `abrirFicha('${escAttr(placa || '')}')`}">Cancelar</button>
      <span class="form-aviso">${bloqueadas} colunas com fórmula ou preenchidas por script ficam de fora — são atualizadas pela própria planilha.</span>
    </div>`);
  cls('gaveta-fundo', 'aberta', true); cls('gaveta', 'aberta', true);
  document.body.style.overflow = 'hidden';
  const corpoEl = el('gaveta-corpo'); if (corpoEl) corpoEl.scrollTop = 0;
  document.querySelectorAll('#gaveta-corpo .foto-slot input[type=file]').forEach(inp => inp.addEventListener('change', () => {
    if (inp.files && inp.files[0]) enviarFoto(placa, inp.dataset.ang, inp.files[0]);
    inp.value = '';
  }));
  document.querySelectorAll('#gaveta-corpo [data-e]').forEach(i => i.addEventListener('input', () => {
    const fc = i.closest('.form-campo'); fc.classList.toggle('mudou', i.value !== fc.dataset.original);
  }));
  ouvir('btn-salvar-viatura', 'click', () => enviarFormViatura(novo ? null : placa));
}

function enviarFormViatura(placa) {
  const novo = !placa;
  const alteracoes = {};
  document.querySelectorAll('#gaveta-corpo .form-campo[data-campo]').forEach(fc => {
    const i = fc.querySelector('[data-e]'); if (!i) return;
    let valor = i.value;
    if (fc.dataset.campo === 'placa') valor = valor.trim().toUpperCase();
    if (novo ? valor !== '' : valor !== fc.dataset.original) alteracoes[fc.dataset.campo] = valor;
  });
  if (novo) {
    const faltando = [];
    document.querySelectorAll('#gaveta-corpo .form-campo[data-campo]').forEach(fc => {
      const i = fc.querySelector('[data-e]'); if (!i || !i.hasAttribute('data-obrig')) return;
      if (!String(i.value).trim()) { faltando.push(fc.querySelector('label').textContent.replace(' *', '').trim()); fc.classList.add('faltando'); }
      else fc.classList.remove('faltando');
    });
    if (faltando.length) { toast('Preencha os obrigatórios: ' + faltando.slice(0, 5).join(', ') + (faltando.length > 5 ? '…' : '')); return; }
  }
  if (novo && !alteracoes.placa) { toast('Informe a placa.'); return; }
  if (!novo && !Object.keys(alteracoes).length) { toast('Nada foi alterado.'); return; }
  const btn = el('btn-salvar-viatura'); if (btn) { btn.disabled = true; btn.textContent = 'Gravando na ConsultaBD…'; }
  const depois = r => {
    if (sessaoExpirou(r)) return;
    if (!r || !r.ok) { if (btn) { btn.disabled = false; btn.textContent = novo ? 'Cadastrar viatura' : 'Salvar alterações'; } toast((r && r.erro) || 'Falha ao gravar.'); return; }
    let msg = (novo ? 'Viatura cadastrada' : r.gravados.length + ' campo(s) gravado(s)');
    if (r.recusados && r.recusados.length) msg += ' • recusados: ' + r.recusados.join('; ');
    toast(msg);
    const alvo = novo ? alteracoes.placa : placa;
    fecharFicha();
    recarregarAposEdicao(alvo);
  };
  const falha = e => { if (btn) { btn.disabled = false; btn.textContent = novo ? 'Cadastrar viatura' : 'Salvar alterações'; } toast('Erro: ' + (e && e.message ? e.message : e)); };
  if (novo) google.script.run.withSuccessHandler(depois).withFailureHandler(falha).criarViatura(ESTADO.token, alteracoes);
  else google.script.run.withSuccessHandler(depois).withFailureHandler(falha).salvarViatura(ESTADO.token, placa, alteracoes);
}

function recarregarAposEdicao(placa) {
  toast('Recarregando dados da planilha…');
  google.script.run
    .withSuccessHandler(dados => {
      if (sessaoExpirou(dados)) return;
      if (!dados || dados.erro) { toast('Gravado, mas a releitura falhou — use o botão ⟳.'); return; }
      iniciar(dados);
      if (placa && ESTADO.veiculos.some(x => x.placa === placa)) abrirFicha(placa);
    })
    .withFailureHandler(() => toast('Gravado, mas a releitura falhou — use o botão ⟳.'))
    .carregarDados(ESTADO.token, true);
}

function _redimensionarImagem_(arquivo, maxLado, qualidade) {
  return new Promise((res, rej) => {
    const leitor = new FileReader();
    leitor.onerror = () => rej(new Error('Falha ao ler o arquivo'));
    leitor.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('Arquivo não é uma imagem válida'));
      img.onload = () => {
        const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const dataUrl = c.toDataURL('image/jpeg', qualidade);
        res(dataUrl.substring(dataUrl.indexOf(',') + 1));
      };
      img.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
  });
}

function enviarFoto(placa, ang, arquivo) {
  if (!ESTADO.dados.fotosHabilitadas) { toast('Envio de fotos desligado (CONFIG.PASTA_FOTOS vazio).'); return; }
  const status = el('foto-status-' + ang);
  const diga = t => { if (status) status.textContent = t; };
  diga('Comprimindo…');
  _redimensionarImagem_(arquivo, 1600, 0.85)
    .then(base64 => {
      diga('Enviando (' + Math.round(base64.length * 0.75 / 1024) + ' KB)…');
      google.script.run
        .withSuccessHandler(r => {
          if (sessaoExpirou(r)) return;
          if (!r || !r.ok) { diga(''); toast((r && r.erro) || 'Falha no envio.'); return; }
          diga('Salva ✓');
          const v = ESTADO.veiculos.find(x => x.placa === placa);
          if (v) { v.fotos = v.fotos || {}; v.fotos[ang] = r.link; v.temFotos = 'Sim'; }
          const slot = document.querySelector(`.foto-slot[data-ang="${ang}"] .foto`);
          if (slot) { slot.classList.remove('sem'); slot.innerHTML = `<img src="https://drive.google.com/thumbnail?id=${r.id}&sz=w400"><span class="rotulo">${ang}</span>`; }
          toast('Foto ' + ang + ' de ' + placa + ' atualizada na ConsultaBD');
        })
        .withFailureHandler(e => { diga(''); toast('Erro no envio: ' + (e && e.message ? e.message : e)); })
        .salvarFotoViatura(ESTADO.token, placa, ang, base64, 'image/jpeg');
    })
    .catch(e => { diga(''); toast(e.message); });
}

const ACOES_DEF = {
  crlv:   { rotulo: 'Baixar CRLV (DETRAN)',        fn: 'acaoBaixarCrlv',      fila: true,  desc: 'Entra na Central do DETRAN-CE com placa + renavam, baixa o CRLV-e (usa CRV e código de segurança das colunas BA/BB), salva na pasta do Drive, grava o link e ajusta o Ano Exercício lendo o PDF.' },
  audit:  { rotulo: 'Auditar CRLV',                fn: 'acaoAuditarCrlv',     fila: false, desc: 'Abre o PDF do link salvo, confere se a placa do documento bate (pega CRLV trocado) e ajusta o Ano Exercício da coluna C conforme o documento.' },
  multas: { rotulo: 'Consultar multas (DETRAN)',   fn: 'acaoConsultarMultas', fila: true,  desc: 'Consulta a situação de multas no DETRAN e grava o resultado com a data na coluna O — o mesmo texto que alimenta a ficha e os filtros.' },
  boleto: { rotulo: 'Gerar boleto p/ licenciar',   fn: 'acaoGerarBoleto',     fila: true,  desc: 'Verifica o licenciamento no DETRAN: JÁ LICENCIADO, PENDÊNCIA, ou gera o boleto (PDF salvo na pasta de CRLVs com link no registro).' }
};

function renderAcoes(lista) {
  if (!ESTADO.admin) return;
  const c = el('acoes-conteudo'); if (!c) return;
  if (ESTADO.subAcoes === 'completude') return renderCompletude(c, lista);
  if (ESTADO.subAcoes === 'fila') return renderFila(c);
  if (ESTADO.subAcoes === 'registro') return renderRegistroAcoes(c);
  renderExecutarAcoes(c, lista);
}

/* ---------------- elegibilidade por ação ---------------- */
function anoAtual() { return new Date().getFullYear(); }
function consultadaHoje(v) {
  if (!v.multasConsultaEm) return false;
  const hoje = new Date(); const dd = ('0' + hoje.getDate()).slice(-2) + '/' + ('0' + (hoje.getMonth() + 1)).slice(-2) + '/' + hoje.getFullYear();
  return v.multasConsultaEm === dd;
}
function elegiveis(acao, lista, op) {
  const motivo = {};
  const sel = lista.filter(v => {
    if (acao === 'crlv') {
      if (!v.crv || !v.codCrv) { motivo[v.placa] = 'sem CRV/código'; return false; }
      if (!v.renavam) { motivo[v.placa] = 'sem renavam'; return false; }
      if (op.escopo === 'sem' && v.linkCrlv) { motivo[v.placa] = 'já tem CRLV'; return false; }
      if (op.escopo === 'desatualizado' && v.linkCrlv && v.anoEx >= anoAtual()) { motivo[v.placa] = 'CRLV em dia'; return false; }
      return true;
    }
    if (acao === 'audit') {
      if (!v.linkCrlv) { motivo[v.placa] = 'sem CRLV para auditar'; return false; }
      return true;
    }
    if (acao === 'multas') {
      if (!v.renavam) { motivo[v.placa] = 'sem renavam'; return false; }
      if (op.pularHoje && consultadaHoje(v)) { motivo[v.placa] = 'já consultada hoje'; return false; }
      return true;
    }
    if (acao === 'boleto') {
      if (!v.renavam) { motivo[v.placa] = 'sem renavam'; return false; }
      if (op.somenteAtrasados && v.anoEx && v.anoEx >= anoAtual()) { motivo[v.placa] = 'licenciamento em dia'; return false; }
      return true;
    }
    return false;
  });
  return { sel: sel, motivo: motivo };
}
function opcoesAcao(acao) {
  if (acao === 'crlv') { const r = document.querySelector('input[name="crlv-escopo"]:checked'); return { escopo: r ? r.value : 'sem' }; }
  if (acao === 'multas') return { pularHoje: !el('multas-rehoje') || !el('multas-rehoje').checked };
  if (acao === 'boleto') return { somenteAtrasados: !el('boleto-todas') || !el('boleto-todas').checked };
  return {};
}

function renderExecutarAcoes(c, lista) {
  const lote = ESTADO.lote;
  const cartoes = Object.keys(ACOES_DEF).map(k => {
    const a = ACOES_DEF[k];
    const op = k === 'crlv' ? `
      <div class="acao-opcoes">
        <label><input type="radio" name="crlv-escopo" value="sem" checked> Apenas viaturas sem CRLV</label>
        <label><input type="radio" name="crlv-escopo" value="desatualizado"> Sem CRLV ou com exercício desatualizado</label>
        <label><input type="radio" name="crlv-escopo" value="todas"> Todas as exibidas</label>
      </div>` :
      k === 'multas' ? `<div class="acao-opcoes"><label><input type="checkbox" id="multas-rehoje"> Consultar novamente as já consultadas hoje</label></div>` :
      k === 'boleto' ? `<div class="acao-opcoes"><label><input type="checkbox" id="boleto-todas"> Incluir também as com licenciamento em dia</label></div>` : '';
    return `<div class="acao-cartao"><h4>${a.rotulo}</h4><div class="desc">${a.desc}</div>${op}
      <button class="btn amarelo" data-acao="${k}" ${lote ? 'disabled' : ''}>${a.fila ? 'Enviar exibidas para a fila' : 'Executar nas exibidas'}</button>
      ${a.fila ? '<div class="cartao-dica" style="margin-top:6px">Depende do DETRAN: entra na fila e o trabalhador local executa.</div>' : ''}</div>`;
  }).join('');
  c.innerHTML = `
    <div class="cartao largo" style="margin-bottom:14px"><div class="cartao-cab"><h3>Central de Ações</h3><small>${lista.length} viaturas na seleção atual</small></div>
      <div class="cartao-dica" style="margin:0 0 8px"><b>Ações do DETRAN</b> (CRLV, multas, boleto) entram numa fila e são executadas pelo trabalhador <code>worker_detran.py</code> na sua máquina — o Google não alcança o portal do DETRAN. <b>Auditar CRLV</b> e <b>Anexar CRLV</b> rodam direto aqui.</div>
      <div class="cartao-dica" style="margin:0">O lote roda sobre <b>as viaturas exibidas</b> — use os filtros da esquerda para escolher o alvo (unidade, status, placa…). Cada viatura é processada uma a uma no DETRAN, com pausa de 1 s entre elas; tudo fica no Registro. Ações individuais ficam na ficha de cada viatura.</div></div>
    <div class="grade" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">${cartoes}</div>
    <div id="lote-area">${lote ? '' : ''}</div>`;
  c.querySelectorAll('button[data-acao]').forEach(b => b.addEventListener('click', () => prepararLote(b.dataset.acao)));
  if (lote) desenharLote();
}

/* ---------------- motor de lote (navegador orquestra; 1 placa por chamada) ---------------- */
function prepararLote(acao) {
  const op = opcoesAcao(acao);
  const e = elegiveis(acao, ESTADO.filtrado, op);
  const pulados = Object.keys(e.motivo).map(p => ({ placa: p, st: 'PULADA', detalhe: e.motivo[p] }));
  if (!e.sel.length) { toast('Nenhuma viatura elegível na seleção (' + pulados.length + ' puladas).'); return; }
  const naFila = !!ACOES_DEF[acao].fila;
  if (!confirm(ACOES_DEF[acao].rotulo + '\n\n' + (naFila ? 'Enviar ' : 'Executar em ') + e.sel.length + ' viatura(s)' +
      (naFila ? ' para a fila do DETRAN?' : '?') + (pulados.length ? '\n(' + pulados.length + ' serão puladas: já feitas ou sem dados)' : ''))) return;

  // Ações que dependem do DETRAN não rodam aqui: o Google não alcança o portal.
  // Vão para a aba FilaAcoes e o worker_detran.py executa na rede local.
  if (naFila) {
    const botao = document.querySelector('button[data-acao="' + acao + '"]');
    if (botao) { botao.disabled = true; botao.textContent = 'Enfileirando…'; }
    google.script.run
      .withSuccessHandler(r => {
        if (sessaoExpirou(r)) return;
        if (!r || !r.ok) { toast((r && r.erro) || 'Falha ao enfileirar.'); renderAcoes(ESTADO.filtrado); return; }
        toast(r.enfileiradas + ' viatura(s) na fila do DETRAN' + (r.repetidas && r.repetidas.length ? ' • ' + r.repetidas.length + ' já estavam pendentes' : '') + '. Rode o trabalhador para processar.');
        ESTADO.subAcoes = 'fila';
        document.querySelectorAll('#subabas-acoes .subaba').forEach(x => x.classList.toggle('ativa', x.dataset.sub === 'fila'));
        renderAcoes(ESTADO.filtrado);
      })
      .withFailureHandler(err => { toast('Erro: ' + (err && err.message ? err.message : err)); renderAcoes(ESTADO.filtrado); })
      .enfileirarAcoes(ESTADO.token, acao, e.sel.map(v => v.placa));
    return;
  }

  ESTADO.lote = { acao: acao, fila: e.sel.map(v => v.placa), total: e.sel.length, feito: 0, ok: 0, erro: 0, ativo: true, itens: pulados.slice() };
  renderAcoes(ESTADO.filtrado);
  processarProximo();
}

function processarProximo() {
  const L = ESTADO.lote;
  if (!L || !L.ativo) return;
  if (!L.fila.length) { L.ativo = false; L.terminou = true; desenharLote(); toast('Lote concluído: ' + L.ok + ' ok, ' + L.erro + ' erro(s).'); return; }
  const placa = L.fila.shift();
  L.atual = placa; desenharLote();
  google.script.run
    .withSuccessHandler(r => {
      L.feito++;
      if (r && r.expirado) { L.ativo = false; sessaoExpirou(r); return; }
      if (r && r.ok) { L.ok++; L.itens.unshift({ placa: placa, st: r.status || 'OK', detalhe: (r.detalhe || '') + (r.link ? ' • ' : ''), link: r.link || '' }); }
      else { L.erro++; L.itens.unshift({ placa: placa, st: 'ERRO', detalhe: (r && r.erro) || 'sem resposta' }); }
      desenharLote();
      setTimeout(processarProximo, 1000);
    })
    .withFailureHandler(e => {
      L.feito++; L.erro++;
      L.itens.unshift({ placa: placa, st: 'ERRO', detalhe: String(e && e.message ? e.message : e) });
      desenharLote();
      setTimeout(processarProximo, 1500);
    })[ACOES_DEF[L.acao].fn](ESTADO.token, placa);
}

const CHECAGENS_COMPLETUDE = [
  ['modelo', 'Marca/Modelo'], ['tipo', 'Tipo'], ['categoria', 'Categoria'], ['especie', 'Espécie'], ['cor', 'Cor'], ['comb', 'Combustível'],
  ['anoFab', 'Ano fabr.'], ['anoMod', 'Ano modelo'], ['chassi', 'Chassi'], ['renavam', 'Renavam'], ['blind', 'Blindagem'], ['carac', 'Caracterizado'],
  ['unidade', 'Unidade'], ['uso', 'Uso'], ['status', 'Status'], ['prop', 'Propriedade'],
  ['tombamento', 'Tombamento'], ['linkTomb', 'Termo (PDF)'], ['crv', 'CRV'], ['codCrv', 'Cód. segurança'], ['linkCrlv', 'CRLV'],
  ['fotoFD', 'Foto FD'], ['fotoLE', 'Foto LE'], ['fotoTR', 'Foto TR'], ['fotoLD', 'Foto LD']
];
function faltasDaViatura(v) {
  return CHECAGENS_COMPLETUDE.filter(([campo]) => {
    if (campo.indexOf('foto') === 0) return !(v.fotos && v.fotos[campo.substring(4)]);
    const x = v[campo];
    return x === null || x === undefined || String(x).trim() === '';
  }).map(([, rotulo]) => rotulo);
}

function renderCompletude(c, lista) {
  const linhas = lista.map(v => ({ v: v, faltas: faltasDaViatura(v) }));
  const total = CHECAGENS_COMPLETUDE.length;
  const completas = linhas.filter(l => !l.faltas.length).length;
  const porCampo = new Map();
  linhas.forEach(l => l.faltas.forEach(f => porCampo.set(f, (porCampo.get(f) || 0) + 1)));
  const piores = Array.from(porCampo.entries()).sort((a, b) => b[1] - a[1]);
  linhas.sort((a, b) => b.faltas.length - a.faltas.length || a.v.placa.localeCompare(b.v.placa));
  const cor = p => p >= 100 ? 'var(--verde)' : p >= 80 ? 'var(--azul-claro)' : p >= 60 ? 'var(--ambar)' : 'var(--vermelho)';
  c.innerHTML = `
    <div class="kpis">
      ${kpi('Viaturas na seleção', lista.length, 'os filtros da esquerda valem aqui', '', null, true)}
      ${kpi('Cadastro completo', completas, Math.round(completas / Math.max(1, lista.length) * 100) + '% da seleção', completas === lista.length ? 'verde' : 'ambar', null, true)}
      ${kpi('Campos verificados', total, 'obrigatórios + documentos + fotos', '', null, true)}
      ${kpi('Falta mais', piores.length ? piores[0][0] : '—', piores.length ? 'em ' + piores[0][1] + ' viaturas' : '', piores.length ? 'vermelho' : 'verde', null, true)}
    </div>
    <div class="cartao largo" style="margin-bottom:14px"><div class="cartao-cab"><h3>O que mais falta na seleção</h3><small>clique para ver só quem falta… na tabela abaixo</small></div>
      <div style="display:flex; flex-wrap:wrap; gap:6px">${piores.map(([f, n]) => `<button class="subaba ${ESTADO.filtroFalta === f ? 'ativa' : ''}" data-f="${escAttr(f)}">${esc(f)} (${n})</button>`).join('') || '<span class="ok-txt">Nada faltando</span>'}</div></div>
    <div class="cartao largo"><div class="cartao-cab"><h3>Completude por viatura</h3><small>clique na linha para completar no formulário de edição</small></div>
      <div class="mini-tabela" style="max-height:600px"><table class="tabela-simples"><thead><tr><th>Placa</th><th>Modelo</th><th>Unidade</th><th>Completo</th><th>O que falta</th></tr></thead><tbody>
      ${linhas.filter(l => !ESTADO.filtroFalta || l.faltas.indexOf(ESTADO.filtroFalta) >= 0).slice(0, 300).map(l => {
        const p = Math.round((total - l.faltas.length) / total * 100);
        return `<tr class="linha" data-placa="${escAttr(l.v.placa)}"><td><b style="font-family:var(--fonte-dados)">${esc(l.v.placa)}</b></td><td>${esc(l.v.modeloCurto)}</td><td>${esc(l.v.unidadeCurta)}</td>
          <td style="white-space:nowrap"><span class="completude-barra"><span class="preench" style="width:${p}%; background:${cor(p)}"></span></span> <b style="font-family:var(--fonte-dados)">${p}%</b></td>
          <td>${l.faltas.length ? l.faltas.map(f => `<span class="chip-falta">${esc(f)}</span>`).join('') : '<span class="ok-txt">completo</span>'}</td></tr>`;
      }).join('')}</tbody></table></div></div>`;
  c.querySelectorAll('button[data-f]').forEach(b => b.addEventListener('click', () => { ESTADO.filtroFalta = ESTADO.filtroFalta === b.dataset.f ? '' : b.dataset.f; renderAcoes(ESTADO.filtrado); }));
  c.querySelectorAll('tr.linha').forEach(t => t.addEventListener('click', () => abrirFormViatura(t.dataset.placa)));
  ajustarKpis();
}

/* ---------------- ações individuais na ficha ---------------- */
function acaoIndividual(acao, placa, botao) {
  if (ACOES_DEF[acao] && ACOES_DEF[acao].fila) {
    if (botao) { botao.disabled = true; botao.dataset.txt = botao.textContent; botao.textContent = 'Enfileirando…'; }
    google.script.run
      .withSuccessHandler(r => {
        if (botao) { botao.disabled = false; botao.textContent = botao.dataset.txt; }
        if (sessaoExpirou(r)) return;
        if (!r || !r.ok) { toast((r && r.erro) || 'Falha ao enfileirar.'); return; }
        toast(r.enfileiradas ? placa + ' na fila do DETRAN — rode o trabalhador para processar.' : placa + ' já estava na fila.');
      })
      .withFailureHandler(e => { if (botao) { botao.disabled = false; botao.textContent = botao.dataset.txt; } toast('Erro: ' + (e && e.message ? e.message : e)); })
      .enfileirarAcoes(ESTADO.token, acao, [placa]);
    return;
  }
  if (botao) { botao.disabled = true; botao.dataset.txt = botao.textContent; botao.textContent = 'Executando…'; }
  google.script.run
    .withSuccessHandler(r => {
      if (botao) { botao.disabled = false; botao.textContent = botao.dataset.txt; }
      if (sessaoExpirou(r)) return;
      if (!r || !r.ok) { toast((r && r.erro) || 'Falha na ação.'); return; }
      toast(placa + ': ' + r.status + (r.detalhe ? ' — ' + r.detalhe : ''));
      if (r.link) window.open(r.link, '_blank');
      recarregarAposEdicao(placa);
    })
    .withFailureHandler(e => { if (botao) { botao.disabled = false; botao.textContent = botao.dataset.txt; } toast('Erro: ' + (e && e.message ? e.message : e)); })[ACOES_DEF[acao].fn](ESTADO.token, placa);
}

function enviarCrlvManual(placa, arquivo, statusEl) {
  const diga = t => { if (statusEl) statusEl.textContent = t; };
  if (!/pdf$/i.test(arquivo.type) && !/\.pdf$/i.test(arquivo.name)) { toast('Envie um PDF.'); return; }
  if (arquivo.size > 8 * 1024 * 1024) { toast('PDF acima de 8 MB.'); return; }
  diga('Enviando…');
  const leitor = new FileReader();
  leitor.onload = () => {
    const base64 = String(leitor.result).substring(String(leitor.result).indexOf(',') + 1);
    google.script.run
      .withSuccessHandler(r => {
        if (sessaoExpirou(r)) return;
        if (!r || !r.ok) { diga(''); toast((r && r.erro) || 'Falha no envio.'); return; }
        diga('Anexado ✓'); toast(placa + ': ' + r.detalhe);
        recarregarAposEdicao(placa);
      })
      .withFailureHandler(e => { diga(''); toast('Erro: ' + (e && e.message ? e.message : e)); })
      .anexarCrlv(ESTADO.token, placa, base64);
  };
  leitor.readAsDataURL(arquivo);
}

function renderFila(c) {
  if (!ESTADO.fila) c.innerHTML = '<div class="cartao largo"><div class="vazio"><div class="spinner" style="border-color:#dfe4ee; border-top-color:var(--azul); margin-bottom:10px"></div>Lendo a fila…</div></div>';
  google.script.run

      if (sessaoExpirou(r)) return;

      ESTADO.fila = r;
      desenharFila(c, r);
    })
    .withFailureHandler(e => { c.innerHTML = '<div class="cartao largo"><div class="vazio">Erro: ' + esc(String(e && e.message ? e.message : e)) + '</div></div>'; })

function desenharFila(c, r) {
  const badge = st => st === 'PENDENTE' ? '<span class="badge manutencao">pendente</span>'
    : st === 'EXECUTANDO' ? '<span class="badge cedido">executando</span>'
    : st === 'ERRO' ? '<span class="badge indisponivel">erro</span>'
    : '<span class="badge disponivel">concluído</span>';
  c.innerHTML = `
    <div class="kpis">
      ${kpi('Na fila', r.pendentes, r.pendentes ? 'aguardando o trabalhador' : 'nada a processar', r.pendentes ? 'ambar' : 'verde', null, true)}
      ${kpi('Executando agora', r.executando, r.executando ? 'trabalhador em atividade' : 'trabalhador parado', r.executando ? 'ciano' : '', null, true)}
      ${kpi('Últimos resultados', r.itens.filter(i => i.status === 'CONCLUÍDO' || i.status === 'OK').length, 'nesta lista', '', null, true)}
      ${kpi('Com erro', r.itens.filter(i => i.status === 'ERRO').length, 'conferir detalhe', r.itens.some(i => i.status === 'ERRO') ? 'vermelho' : 'verde', null, true)}
    </div>
    <div class="cartao largo">
      <div class="cartao-cab"><h3>Fila do DETRAN</h3><small>aba FilaAcoes da planilha</small></div>
      <div class="form-acoes" style="margin-top:0">
        <button class="btn claro" onclick="renderFila(document.getElementById('acoes-conteudo'))">Atualizar</button>
        <button class="btn claro" onclick="limparConcluidas()">Limpar concluídas</button>
        <span class="form-aviso">Rode <code>python worker_detran.py</code> na sua máquina para processar a fila.</span>
      </div>
      <div class="mini-tabela" style="max-height:520px"><table class="tabela-simples"><thead><tr><th>Status</th><th>Ação</th><th>Placa</th><th>Pedido em</th><th>Quem</th><th>Resultado</th><th>Detalhe</th></tr></thead><tbody>
      ${r.itens.map(i => `<tr class="linha" data-placa="${escAttr(i.placa)}"><td>${badge(i.status)}</td><td>${esc(i.acao)}</td><td style="font-family:var(--fonte-dados)"><b>${esc(i.placa)}</b></td><td style="white-space:nowrap">${esc(i.criado)}</td><td>${esc((i.quem || '').split('@')[0])}</td><td>${esc(i.resultado)}</td><td title="${escAttr(i.detalhe)}">${esc((i.detalhe || '').substring(0, 90))}</td></tr>`).join('') || '<tr><td colspan="7"><div class="vazio">Fila vazia</div></td></tr>'}</tbody></table></div>
    </div>`;
  c.querySelectorAll('tr.linha').forEach(t => t.addEventListener('click', () => t.dataset.placa && abrirFicha(t.dataset.placa)));
  ajustarKpis();
  if (r.pendentes || r.executando) {
    clearTimeout(ESTADO.filaTimer);
    ESTADO.filaTimer = setTimeout(() => { if (ESTADO.aba === 'acoes' && ESTADO.subAcoes === 'fila') renderFila(el('acoes-conteudo')); }, 10000);
  }
}

function limparConcluidas() {
  google.script.run
    .withSuccessHandler(r => {
      if (sessaoExpirou(r)) return;
      toast(r && r.ok ? (r.removidas || 0) + ' item(ns) removido(s)' : 'Falha ao limpar.');

    })
    .withFailureHandler(e => toast('Erro: ' + (e && e.message ? e.message : e)))

    btn.disabled = true; btn.textContent = 'Baixando da ANP…';
    chamarImportacao('glosaSite', r => { btn.disabled = false; btn.textContent = 'Baixar da ANP e importar'; return r; },
      run => run.importarGlosaAnp(ESTADO.token, comp, 'site', null));
  });
}

/** Executa a chamada ao servidor e desenha o resultado no cartão. */
function chamarImportacao(id, aoTerminar, executar) {
  const status = el('imp-status-' + id), resultado = el('imp-result-' + id);
  if (status) status.textContent = 'Processando…';
  if (resultado) resultado.innerHTML = '';
  const run = google.script.run
    .withSuccessHandler(r => {
      if (aoTerminar) aoTerminar(r);
      if (sessaoExpirou(r)) return;
      if (!r || !r.ok) { if (status) status.textContent = ''; toast((r && r.erro) || 'Falha na importação.'); return; }
      if (status) status.textContent = '';
      desenharResultadoImportacao(id, r);
    })
    .withFailureHandler(e => {
      if (aoTerminar) aoTerminar(null);
      if (status) status.textContent = '';
      toast('Erro: ' + (e && e.message ? e.message : e));
    });
  executar(run);
}

function desenharResultadoImportacao(id, r) {
  const resultado = el('imp-result-' + id);
  const dado = (k, v, classe) => `<div class="dado"><div class="k">${k}</div><div class="v ${classe || ''}" style="font-size:14px">${v}</div></div>`;
  let html = '';
  if (r.campos) {
    const c = r.campos;
    html = `<div class="grade-dados" style="margin-top:10px">
      ${dado('Título', esc(c.titulo || '—'))}${dado('NF', esc(c.numeroNfse || '—'))}
      ${dado('Valor total', esc(c.valorTotal || '—'))}${c.reembolsoPecas ? dado('Peças', esc(c.reembolsoPecas)) : ''}
      ${c.reembolsoMaoObra ? dado('Mão de obra', esc(c.reembolsoMaoObra)) : ''}
      ${dado('Emissão', esc(c.dataEmissao || '—'))}${dado('Vencimento', esc(c.vencimento || '—'))}
      ${dado('Competência', esc(c.competencia || '—'))}${r.linha ? dado('Linha gravada', r.linha, 'ok-txt') : ''}</div>`;
    toast('Título ' + (c.titulo || '') + ' gravado.');
  } else {
    html = `<div class="grade-dados" style="margin-top:10px">
      ${r.lidos !== undefined ? dado('Lidos', fmtInt(r.lidos)) : ''}
      ${dado('Inseridos', fmtInt(r.inseridos || 0), 'ok-txt')}
      ${r.duplicados !== undefined ? dado('Já existiam', fmtInt(r.duplicados)) : ''}
      ${r.periodo ? dado('Período', esc(r.periodo)) : ''}
      ${r.competencia ? dado('Competência', esc(r.competencia)) : ''}</div>`;
    toast(fmtInt(r.inseridos || 0) + ' linha(s) inserida(s)' + (r.destino ? ' em ' + r.destino : ''));
    ESTADO.uso = null;
  }
  if (resultado) resultado.innerHTML = html;
}

function enviarImportacao(id, arquivo) {
  const limite = id === 'titAbast' || id === 'titManut' ? 15 : 25;
  if (arquivo.size > limite * 1024 * 1024) { toast('Arquivo acima de ' + limite + ' MB.'); return; }
  const status = el('imp-status-' + id);
  if (status) status.textContent = 'Lendo ' + arquivo.name + ' (' + Math.round(arquivo.size / 1024) + ' KB)…';
  const leitor = new FileReader();
  leitor.onerror = () => { if (status) status.textContent = 'Falha ao ler o arquivo.'; };
  leitor.onload = () => {
    const base64 = String(leitor.result).substring(String(leitor.result).indexOf(',') + 1);
    const pacote = { nome: arquivo.name, mimeType: arquivo.type, base64: base64 };
    if (status) status.textContent = 'Enviando…' + (id === 'titAbast' || id === 'titManut' ? ' (leitura do PDF pode levar até um minuto)' : '');
    chamarImportacao(id, null, run => {
      if (id === 'abast' || id === 'manut') return run.importarBase(ESTADO.token, id, pacote);
      if (id === 'titAbast') return run.importarTituloAbast(ESTADO.token, pacote);
      if (id === 'titManut') return run.importarTituloManut(ESTADO.token, pacote);
      if (id === 'detalhe') return run.importarDetalhamento(ESTADO.token, pacote, val('det-titulo'), val('det-comp'));
      if (id === 'aceiteGestor') return run.importarAceites(ESTADO.token, pacote, 'Gestor');
      if (id === 'aceiteAuto') return run.importarAceites(ESTADO.token, pacote, 'Automático');
      if (id === 'glosa') return run.importarGlosaAnp(ESTADO.token, val('glosa-comp'), 'arquivo', pacote);
      toast('Tipo de importação desconhecido.');
    });
  };
  leitor.readAsDataURL(arquivo);
}

function renderExportar(c) {
  c.innerHTML = `
    <div class="cartao largo" style="margin-bottom:14px">
      <div class="cartao-cab"><h3>Exportar bases</h3><small>arquivo .xlsx no seu Drive</small></div>
      <div class="cartao-dica" style="margin:0">Gera uma cópia da aba em Excel e devolve o link. Útil para trabalhar os dados fora ou anexar a processos.</div>
    </div>
    <div class="grade" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
      ${['abast', 'manut'].map(t => `<div class="acao-cartao"><h4>${t === 'abast' ? 'AbastBD' : 'ManutBD'}</h4>
        <div class="desc">${t === 'abast' ? 'Todas as transações de abastecimento.' : 'Todas as transações de manutenção.'}</div>
        <button class="btn amarelo" data-exp="${t}">Gerar .xlsx</button>
        <div class="foto-data" id="exp-status-${t}"></div></div>`).join('')}
    </div>`;
  c.querySelectorAll('button[data-exp]').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.exp, status = el('exp-status-' + t);
    b.disabled = true; b.textContent = 'Gerando…';
    if (status) status.textContent = 'Montando o arquivo…';
    google.script.run
      .withSuccessHandler(r => {
        b.disabled = false; b.textContent = 'Gerar .xlsx';
        if (sessaoExpirou(r)) return;
        if (!r || !r.ok) { if (status) status.textContent = ''; toast((r && r.erro) || 'Falha ao exportar.'); return; }
        if (status) status.innerHTML = `<a class="pdf-link" href="${escAttr(r.link)}" target="_blank" rel="noopener">${icoPdf()} ${esc(r.nome)}</a> ${fmtInt(r.linhas)} linhas`;
        window.open(r.link, '_blank');
      })
      .withFailureHandler(e => { b.disabled = false; b.textContent = 'Gerar .xlsx'; if (status) status.textContent = ''; toast('Erro: ' + (e && e.message ? e.message : e)); })
      .exportarBase(ESTADO.token, t);
  }));
}

function renderRelatorios(c) {
  const u = ESTADO.uso && ESTADO.uso.meta;
  const hoje = new Date();
  const mesAtual = hoje.getFullYear() + '-' + ('0' + (hoje.getMonth() + 1)).slice(-2);
  const padrao = u && u.abastAte ? u.abastAte.substring(0, 7) : mesAtual;
  c.innerHTML = `
    <div class="cartao largo" style="margin-bottom:14px">
      <div class="cartao-cab"><h3>Relatórios</h3><small>PDF pronto para anexar ao processo</small></div>
      <div class="cartao-dica" style="margin:0">Os relatórios são montados na hora, em paisagem, com a identidade da PRF — não criam abas na planilha.</div>
    </div>
    <div class="grade" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">
      <div class="acao-cartao">
        <h4>Relatório de Abastecimento</h4>
        <div class="desc">Frota inteira, por competência: totais, evolução mensal, consolidado por unidade, combustível, uso e tipo, rankings de viaturas, postos e cidades, e a seção de alertas (sem cadastro, km zerado ou negativo, consumo fora da faixa, divergência de combustível, preço acima da média, abastecimentos repetidos no mesmo dia).</div>
        <div class="form-grade" style="grid-template-columns:1fr 1fr; margin-bottom:10px">
          <div class="form-campo"><label>Competência inicial</label><input type="month" id="rel-de" value="${padrao}"></div>
          <div class="form-campo"><label>Competência final</label><input type="month" id="rel-ate" value="${padrao}"></div>
        </div>
        <button class="btn amarelo" id="btn-rel-abast">Gerar PDF</button>
        <div class="foto-data" id="rel-status"></div>
        <div id="rel-result"></div>
      </div>
      <div class="acao-cartao">
        <h4>Relatório de Glosa de Abastecimento</h4>
        <div class="desc">Compara o preço pago por litro com o preço máximo de revenda da ANP (mesmo mês, mesma UF) e apura o excedente para glosa na fatura. Separado por combustível, com subtotais e total — no mesmo formato do documento que você protocola. O total apurado é gravado no histórico de glosa.</div>
        <div class="form-campo" style="margin-bottom:8px"><label>Competência</label><input type="month" id="glosa-rel-comp" value="${padrao}"></div>
        <div class="form-campo" style="margin-bottom:10px">
          <label>Combustíveis</label>
          <div id="glosa-combs" class="acao-opcoes" style="max-height:150px; overflow:auto">
            <span class="foto-data">Escolha a competência para listar os combustíveis…</span>
          </div>
        </div>
        <button class="btn amarelo" id="btn-rel-glosa">Gerar PDF</button>
        <div class="foto-data" id="glosa-status"></div>
        <div id="glosa-result"></div>
      </div>
    </div>`;
  ouvir('btn-rel-abast', 'click', () => {
    const de = val('rel-de'), ate = val('rel-ate');
    if (!de || !ate) { toast('Informe as competências.'); return; }
    const btn = el('btn-rel-abast'), status = el('rel-status'), resultado = el('rel-result');
    btn.disabled = true; btn.textContent = 'Gerando…';
    if (status) status.textContent = 'Lendo a AbastBD e montando o documento…';
    if (resultado) resultado.innerHTML = '';
    google.script.run
      .withSuccessHandler(r => {
        btn.disabled = false; btn.textContent = 'Gerar PDF';
        if (sessaoExpirou(r)) return;
        if (!r || !r.ok) { if (status) status.textContent = ''; toast((r && r.erro) || 'Falha ao gerar.'); return; }
        if (status) status.innerHTML = `<a class="pdf-link" href="${escAttr(r.link)}" target="_blank" rel="noopener">${icoPdf()} ${esc(r.nome)}</a>`;
        if (resultado) resultado.innerHTML = `<div class="grade-dados" style="margin-top:10px">
          <div class="dado"><div class="k">Abastecimentos</div><div class="v">${fmtInt(r.resumo.registros)}</div></div>
          <div class="dado"><div class="k">Valor</div><div class="v">${fmtMoeda(r.resumo.valor)}</div></div>
          <div class="dado"><div class="k">Viaturas</div><div class="v">${fmtInt(r.resumo.viaturas)}</div></div>
          <div class="dado"><div class="k">Alertas</div><div class="v ${r.resumo.alertas ? 'alerta-txt' : 'ok-txt'}">${fmtInt(r.resumo.alertas)}</div></div>
        </div>`;
        window.open(r.link, '_blank');
      })
      .withFailureHandler(e => { btn.disabled = false; btn.textContent = 'Gerar PDF'; if (status) status.textContent = ''; toast('Erro: ' + (e && e.message ? e.message : e)); })
      .gerarRelatorioAbastecimento(ESTADO.token, de, ate);
  });
  ouvir('glosa-rel-comp', 'change', carregarCombustiveisGlosa);
  ouvir('btn-rel-glosa', 'click', gerarGlosa);
  carregarCombustiveisGlosa();
}


/* ---------------- Relatório de glosa ---------------- */
function competenciaBR(valorMonth) {
  return valorMonth ? valorMonth.substring(5, 7) + '/' + valorMonth.substring(0, 4) : '';
}

function carregarCombustiveisGlosa() {
  const caixa = el('glosa-combs'); if (!caixa) return;
  const comp = competenciaBR(val('glosa-rel-comp'));
  if (!comp) { caixa.innerHTML = '<span class="foto-data">Escolha a competência.</span>'; return; }
  caixa.innerHTML = '<span class="foto-data">Lendo os abastecimentos da competência…</span>';
  const run = servidor('combustiveisDaCompetencia',
    r => {
      if (!r || !r.ok) { caixa.innerHTML = '<span class="foto-data">' + esc((r && r.erro) || 'Falha ao ler.') + '</span>'; return; }
      if (!r.combustiveis.length) { caixa.innerHTML = '<span class="foto-data">Nenhum abastecimento em ' + esc(comp) + '.</span>'; return; }
      caixa.innerHTML = r.combustiveis.map(c => `<label title="${c.anp ? 'ANP: ' + escAttr(c.anp) : 'sem produto correspondente na ANP'}">
        <input type="checkbox" value="${escAttr(c.nome)}" ${c.anp ? 'checked' : 'disabled'}> ${esc(c.nome)}
        <small style="color:var(--tinta-suave)">${c.qtd} abast.${c.anp ? '' : ' • sem equivalente na ANP'}</small></label>`).join('');
    },
    e => { caixa.innerHTML = '<span class="foto-data">' + esc(String(e && e.message ? e.message : e)) + '</span>'; });
  if (run) run.combustiveisDaCompetencia(ESTADO.token, comp);
}

function gerarGlosa() {
  const comp = competenciaBR(val('glosa-rel-comp'));
  if (!comp) { toast('Informe a competência.'); return; }
  const escolhidos = Array.from(document.querySelectorAll('#glosa-combs input:checked')).map(i => i.value);
  if (!escolhidos.length) { toast('Escolha ao menos um combustível.'); return; }
  const btn = el('btn-rel-glosa'), status = el('glosa-status'), resultado = el('glosa-result');
  btn.disabled = true; btn.textContent = 'Apurando…';
  if (status) status.textContent = 'Cruzando AbastBD com o histórico da ANP…';
  if (resultado) resultado.innerHTML = '';
  const run = servidor('gerarRelatorioGlosa',
    r => {
      btn.disabled = false; btn.textContent = 'Gerar PDF';
      if (!r || !r.ok) { if (status) status.textContent = ''; toast((r && r.erro) || 'Falha ao gerar.'); return; }
      if (status) status.innerHTML = `<a class="pdf-link" href="${escAttr(r.link)}" target="_blank" rel="noopener">${icoPdf()} ${esc(r.nome)}</a>`;
      if (resultado) resultado.innerHTML = `<div class="grade-dados" style="margin-top:10px">
        <div class="dado"><div class="k">Total da glosa</div><div class="v ${r.total ? 'alerta-txt' : 'ok-txt'}">${fmtMoeda(r.total)}</div></div>
        <div class="dado"><div class="k">Acima do teto</div><div class="v">${fmtInt(r.comGlosa)} de ${fmtInt(r.avaliados)}</div></div>
        ${r.grupos.map(g => `<div class="dado"><div class="k">${esc(g.combustivel)}</div><div class="v">${fmtMoeda(g.subtotal)} <small style="font-weight:500; color:var(--tinta-suave)">${g.itens} item(ns)</small></div></div>`).join('')}
      </div>${r.semTeto && r.semTeto.length ? `<div class="cartao-dica">Sem teto publicado na ANP: ${esc(r.semTeto.join('; '))}</div>` : ''}`;
      window.open(r.link, '_blank');
    },
    e => { btn.disabled = false; btn.textContent = 'Gerar PDF'; if (status) status.textContent = ''; });
  if (run) run.gerarRelatorioGlosa(ESTADO.token, comp, escolhidos);
}
