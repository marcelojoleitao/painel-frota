<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
  </head>
  <body>
    <p>Cole as placas no formato <b>ANTIGA</b>, uma por linha:</p>
    <textarea id="input" style="width:100%; height:200px;"></textarea>
    <br><br>
    <button onclick="enviar()">Atualizar</button>
    <script>
      function enviar() {
        const texto = document.getElementById("input").value;
        google.script.run
          .withSuccessHandler(() => google.script.host.close())
          .atualizarPlacasEmTodasAbas(texto);
      }
    </script>
  </body>
</html>
